# Build dist/ and deploy to Cloudflare Pages.
#
# Triggers: manual (workflow_dispatch) OR every push to main (when a Pages-capable token exists).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID   — Workers & Pages → Overview → Account ID
#   CF_PAGES_PROJECT_NAME   — Pages project → Settings → General → Project name (slug)
#
# At least ONE bearer with Cloudflare Pages — Edit (and ideally Zone — Cache Purge):
#   CLOUDFLARE_API_TOKEN    — "Edit Cloudflare Pages" template (recommended)
#   CF_API_TOKEN            — fallback if it includes Pages deploy permission
#
# Optional: CF_ZONE_ID (purge auto-discovers if omitted)
#
# Push to main: if both tokens are empty, the workflow succeeds with a notice (no deploy).
# workflow_dispatch: fails clearly if Pages token missing (so a manual run is never a silent no-op).
name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-cf-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.repository.fork == false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Require Cloudflare Pages secrets
        id: req
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "token_source=none" >> "$GITHUB_OUTPUT"
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            PAGES_TOK="$CLOUDFLARE_API_TOKEN"
            echo "token_source=cloudflare" >> "$GITHUB_OUTPUT"
          else
            PAGES_TOK="${CF_API_TOKEN:-}"
            if [ -n "$PAGES_TOK" ]; then
              echo "token_source=cf" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$PAGES_TOK" ]; then
              echo "::notice title=Pages auto-deploy skipped::Add CLOUDFLARE_API_TOKEN (Pages Edit) or CF_API_TOKEN with Pages permission to deploy on each main push."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          missing=0
          if [ -z "$PAGES_TOK" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN or CF_API_TOKEN with Cloudflare Pages — Edit."
            missing=1
          fi
          if [ -z "${CF_PAGES_PROJECT_NAME:-}" ]; then
            echo "::error::Missing CF_PAGES_PROJECT_NAME."
            missing=1
          fi
          exit $missing

      - name: Deploy to Cloudflare Pages (wrangler, token fallback)
        if: ${{ steps.req.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          deploy_with_token() {
            local token="$1"
            local mode="${2:-with_account}"
            if [ "$mode" = "without_account" ]; then
              env -u CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN="$token" npx --yes wrangler@latest pages deploy dist --project-name="$CF_PAGES_PROJECT_NAME"
            else
              CLOUDFLARE_API_TOKEN="$token" npx --yes wrangler@latest pages deploy dist --project-name="$CF_PAGES_PROJECT_NAME"
            fi
          }
          deploy_with_fallbacks() {
            local token="$1"
            local label="$2"
            if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
              echo "Trying Pages deploy with $label and CLOUDFLARE_ACCOUNT_ID..."
              if deploy_with_token "$token" "with_account"; then
                echo "Pages deploy succeeded with $label (with account id)."
                return 0
              fi
              echo "::warning::Pages deploy failed with $label + account id. Retrying without account id..."
            else
              echo "CLOUDFLARE_ACCOUNT_ID not set; trying deploy with $label and implicit account."
            fi
            if deploy_with_token "$token" "without_account"; then
              echo "Pages deploy succeeded with $label (without account id)."
              return 0
            fi
            return 1
          }
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Trying Pages deploy with CLOUDFLARE_API_TOKEN..."
            if deploy_with_fallbacks "$CLOUDFLARE_API_TOKEN" "CLOUDFLARE_API_TOKEN"; then
              echo "Pages deploy succeeded with CLOUDFLARE_API_TOKEN."
              exit 0
            fi
            echo "::warning::Pages deploy failed with CLOUDFLARE_API_TOKEN. Trying CF_API_TOKEN fallback if available..."
          fi
          if [ -n "${CF_API_TOKEN:-}" ]; then
            deploy_with_fallbacks "$CF_API_TOKEN" "CF_API_TOKEN"
            echo "Pages deploy succeeded with CF_API_TOKEN."
            exit 0
          fi
          echo "::error::No usable deploy token found. Set CLOUDFLARE_API_TOKEN (preferred) or CF_API_TOKEN with Pages deploy permission."
          exit 1

      - name: Purge zone cache after deploy
        if: ${{ steps.req.outputs.skip != 'true' }}
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run purge:cloudflare:social

      - name: Verify live markers (best-effort)
        if: ${{ steps.req.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          LIVE_BASE_URL: https://todaysdailybattle.com
          LIVE_VERIFY_ATTEMPTS: '4'
          LIVE_VERIFY_SLEEP_MS: '25000'
        run: npm run verify:live-key-html:retry
