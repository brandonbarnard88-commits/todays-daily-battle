# Optional: deploy dist/ to Cloudflare Pages (manual only).
#
# Auth (pick one):
#   - secrets.CF_API_TOKEN — if it already includes Cloudflare Pages — Edit (in addition to whatever you use for cache purge), OR
#   - secrets.CLOUDFLARE_API_TOKEN — dedicated Pages deploy token
#
# Optional overrides:
#   - secrets.CLOUDFLARE_ACCOUNT_ID — if unset, resolved via Zone API (needs zone read on todaysdailybattle.com)
#   - secrets.CF_PAGES_PROJECT_NAME — if unset, defaults to todaysdailybattle-site (see wrangler.toml name)
#
# Do not use alongside another auto-prod deploy to the same domain without a plan.
name: Deploy Cloudflare Pages (manual)

on:
  workflow_dispatch:

concurrency:
  group: deploy-cf-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Resolve Cloudflare account ID and validate token
        id: cf_ids
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          STATIC_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: todaysdailybattle.com
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::Add repository secret CF_API_TOKEN and/or CLOUDFLARE_API_TOKEN (needs Cloudflare Pages — Edit for deploy)."
            exit 1
          fi
          if [ -n "$STATIC_ACCOUNT" ]; then
            echo "account_id=$STATIC_ACCOUNT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RES=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json")
          AID=$(echo "$RES" | jq -r '.result[0].account.id // empty')
          if [ -z "$AID" ] || [ "$AID" = "null" ]; then
            echo "::error::Could not resolve account ID from Zone API. Add repository secret CLOUDFLARE_ACCOUNT_ID, or use a token with Zone read on ${DOMAIN}."
            exit 1
          fi
          echo "account_id=$AID" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ steps.cf_ids.outputs.account_id }}
          command: pages deploy dist --project-name=${{ secrets.CF_PAGES_PROJECT_NAME || 'todaysdailybattle-site' }}
