# Deploy dist/ to Cloudflare Pages (manual workflow_dispatch only).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Cloudflare → My Profile → API Tokens → Create → use "Edit Cloudflare Pages" template (or custom with Pages Edit).
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare Dashboard → Workers & Pages → Overview → Account ID (right column).
#   CF_PAGES_PROJECT_NAME  — Workers & Pages → your project → Settings → General → Project name (exact slug, not the public hostname).
#
# After a green run, purge CDN cache (Dashboard → Caching, or repo purge workflow) so /coloring.html and assets update everywhere.
#
# Do not use alongside another auto-prod deploy to the same domain without a plan.
name: Deploy Cloudflare Pages (manual)

on:
  workflow_dispatch:

concurrency:
  group: deploy-cf-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Require Cloudflare Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT_NAME: ${{ secrets.CF_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN (Cloudflare API token with Cloudflare Pages — Edit)."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID (Workers & Pages → Overview → Account ID)."
            missing=1
          fi
          if [ -z "$CF_PAGES_PROJECT_NAME" ]; then
            echo "::error::Missing repository secret CF_PAGES_PROJECT_NAME (exact Pages project slug from project Settings → General)."
            missing=1
          fi
          exit $missing

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CF_PAGES_PROJECT_NAME }}
