# Optional: deploy dist/ to Cloudflare Pages from GitHub (manual only).
# Set secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CF_PAGES_PROJECT_NAME
# Do not use alongside another auto-prod deploy to the same domain without a plan.
name: Deploy Cloudflare Pages (manual)

on:
  workflow_dispatch:

concurrency:
  group: deploy-cf-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      # Fail fast with a clear message — empty secrets produce `pages deploy --project-name=` and wrangler exits with a generic token error.
      - name: Require Cloudflare Pages secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ secrets.CF_PAGES_PROJECT_NAME }}
        run: |
          missing=0
          if [ -z "$CF_TOKEN" ]; then echo "::error::Add repository secret CLOUDFLARE_API_TOKEN (Cloudflare API token with Account → Cloudflare Pages → Edit)."; missing=1; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "::error::Add repository secret CLOUDFLARE_ACCOUNT_ID (Dashboard → Workers & Pages → right column)."; missing=1; fi
          if [ -z "$CF_PROJECT" ]; then echo "::error::Add repository secret CF_PAGES_PROJECT_NAME (exact Pages project name, not the production hostname)."; missing=1; fi
          exit $missing

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CF_PAGES_PROJECT_NAME }}
