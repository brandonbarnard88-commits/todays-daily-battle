name: Lighthouse CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lighthouse-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LH_MIN_PERF: "0.70"
      LH_MIN_A11Y: "0.90"
      LH_MIN_BP: "0.85"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Lighthouse CI guardrail
        run: npm run audit:lighthouse:ci
