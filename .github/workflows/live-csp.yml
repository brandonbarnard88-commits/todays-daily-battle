# Ensures production document responses include CSP (Pages _headers or equivalent).
# Fails fast if Transform Rules strip CSP or output dir is wrong.
name: Live CSP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-csp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify live Content-Security-Policy
        run: node scripts/verify-live-csp.mjs
        env:
          LIVE_SITE_URL: https://todaysdailybattle.com
