# After each push to main, purge the full Cloudflare zone cache.
#
# Set at least one repository secret (both work — cloudflare-purge.mjs aliases them):
#   CF_API_TOKEN              — "Edit zone cache" for todaysdailybattle.com
#   CLOUDFLARE_API_TOKEN      — same bearer if it includes Cache Purge (e.g. combined Pages + purge token)
#
# Optional: CF_ZONE_ID (auto-discovered if omitted)
#
# If both are empty or placeholder-only, this job fails so main does not silently ship with stale edge HTML.
name: Purge Cloudflare cache on push

on:
  push:
    branches:
      - main

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Purge Cloudflare zone cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ] && [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Add CF_API_TOKEN and/or CLOUDFLARE_API_TOKEN (must include Cache Purge for the zone). See scripts/cloudflare-purge.mjs header."
            exit 1
          fi
          if [ -n "${CF_API_TOKEN:-}" ] && echo "$CF_API_TOKEN" | grep -qiE 'your_token|placeholder|changeme|paste_your'; then
            echo "::error::CF_API_TOKEN looks like a placeholder."
            exit 1
          fi
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && echo "$CLOUDFLARE_API_TOKEN" | grep -qiE 'your_token|placeholder|changeme|paste_your'; then
            echo "::error::CLOUDFLARE_API_TOKEN looks like a placeholder."
            exit 1
          fi
          npm run purge:cloudflare
