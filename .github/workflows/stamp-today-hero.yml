# Stamp today's hero verse into first-paint HTML at midnight UTC.
# JS still picks the live queue if HTML is a few hours late; this keeps first paint honest.
# verify-dist-hero-lock refuses unpublished days that repeat yesterday's chapter.
name: Stamp today's hero

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stamp-today-hero
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.repository.fork == false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inject today's verse
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -f verse-context.js dist/verse-context.js
          cp -f hero-daily-365-explanations.js dist/hero-daily-365-explanations.js
          cp -f tdb-verse-accuracy.js dist/tdb-verse-accuracy.js
          node scripts/inject-home-hero.mjs
          node scripts/inject-porch-verse-widget.mjs
          node scripts/verify-verse-accuracy.mjs
          node scripts/verify-hero-no-leftover.mjs
          node scripts/verify-porch-verse-widget.mjs
          node scripts/verify-dist-hero-lock.mjs
          node scripts/verify-locale-hub-today.mjs

      - name: Commit if the stamp changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/index.html dist/today-kjv-verse.json dist/yesterday-kjv-verse.json \
            dist/verse-context.js dist/hero-daily-365-explanations.js dist/tdb-verse-accuracy.js \
            family.html dist/family.html verse.html dist/verse.html explore.html dist/explore.html \
            plans.html dist/plans.html kids-corner.html dist/kids-corner.html \
            kids/corner.html dist/kids/corner.html church/daily.html dist/church/daily.html \
            verso.html dist/verso.html \
            es/index.html dist/es/index.html \
            fr/index.html dist/fr/index.html \
            pt/index.html dist/pt/index.html \
            zh/index.html dist/zh/index.html \
            ru/index.html dist/ru/index.html \
            hi/index.html dist/hi/index.html \
            id/index.html dist/id/index.html \
            ar/index.html dist/ar/index.html \
            sv/index.html dist/sv/index.html \
            tl/index.html dist/tl/index.html \
            sw/index.html dist/sw/index.html \
            bn/index.html dist/bn/index.html || true
          if git diff --cached --quiet; then
            echo "Today already stamped."
            exit 0
          fi
          git commit -m "chore(home): stamp today's verse for first paint"
          git push origin HEAD:main
