# After the midnight UTC stamp: production first-paint must be today’s official KJV.
# If the check fails, restamp, push, purge the edge, and recheck so a missed
# stamp or stale CDN can fix itself. A wrong verse in the queue still fails.
name: Verify live hero today

on:
  schedule:
    - cron: '45 0 * * *'
    - cron: '15 12 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Origin to test (leave empty for apex + www)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: stamp-today-hero
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event.repository.fork == false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compare live homepage to today's official KJV
        id: check
        continue-on-error: true
        env:
          LIVE_BASE_URL: ${{ github.event.inputs.base_url }}
          LIVE_HERO_RETRIES: '6'
          LIVE_HERO_RETRY_MS: '25000'
        run: npm run verify:live-hero

      - name: Restamp today's verse
        if: steps.check.outcome == 'failure'
        run: node scripts/heal-live-hero-today.mjs --stamp-only

      - name: Commit stamp if it changed
        if: steps.check.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/index.html dist/today-kjv-verse.json dist/yesterday-kjv-verse.json || true
          if git diff --cached --quiet; then
            echo "Stamp already current — leftover is likely a stale edge cache."
            exit 0
          fi
          git commit -m "chore(home): restamp today's verse after live check failed"
          git push origin HEAD:main

      - name: Wait for Pages to pick up the stamp
        if: steps.check.outcome == 'failure'
        run: sleep 90

      - name: Purge homepage cache
        if: steps.check.outcome == 'failure'
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/heal-live-hero-today.mjs --purge-only

      - name: Recheck live homepage
        if: steps.check.outcome == 'failure'
        env:
          LIVE_BASE_URL: ${{ github.event.inputs.base_url }}
          LIVE_HERO_RETRIES: '8'
          LIVE_HERO_RETRY_MS: '25000'
        run: npm run verify:live-hero
