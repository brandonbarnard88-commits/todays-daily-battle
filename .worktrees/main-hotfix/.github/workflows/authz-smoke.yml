# Live Supabase RLS + Edge Function checks (curl). Requires repo secrets.
# Add: Settings → Secrets and variables → Actions:
#   SUPABASE_URL, SUPABASE_ANON_KEY
# Optional: AUTHZ_ACCESS_TOKEN (short-lived user JWT for E2)
name: Authz smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  authz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check authz smoke secrets
        id: authz_check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            exit 0
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            echo "::notice title=Authz smoke skipped::Missing SUPABASE_URL/SUPABASE_ANON_KEY secrets. Set them to enable push-time authz smoke."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Missing SUPABASE_URL and/or SUPABASE_ANON_KEY secrets."
          exit 1

      - name: Run authz smoke tests
        if: ${{ steps.authz_check.outputs.skip != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AUTHZ_ACCESS_TOKEN: ${{ secrets.AUTHZ_ACCESS_TOKEN }}
          AUTHZ_STRICT: "1"
        run: npm run test:authz-smoke
