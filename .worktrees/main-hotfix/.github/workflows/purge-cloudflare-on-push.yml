# After each push to main, purge the full Cloudflare zone cache.
#
# Set at least one repository secret (both work — cloudflare-purge.mjs aliases them):
#   CF_API_TOKEN              — "Edit zone cache" for todaysdailybattle.com
#   CLOUDFLARE_API_TOKEN      — same bearer if it includes Cache Purge (e.g. combined Pages + purge token)
#
# Optional: CF_ZONE_ID (auto-discovered if omitted)
#
# If both are empty or placeholder-only, this job fails so main does not silently ship with stale edge HTML.
name: Purge Cloudflare cache on push

on:
  push:
    branches:
      - main

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Purge Cloudflare zone cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ] && [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing CF_API_TOKEN / CLOUDFLARE_API_TOKEN. Cloudflare zone cache purge is required for production freshness."
            exit 1
          fi
          TOKEN_TO_CHECK="${CF_API_TOKEN:-${CLOUDFLARE_API_TOKEN:-}}"
          if [ -n "${TOKEN_TO_CHECK:-}" ] && echo "$TOKEN_TO_CHECK" | grep -qiE 'your_token|placeholder|changeme|paste_your'; then
            echo "::error::Cloudflare purge token looks like a placeholder. Use a real token with Zone Cache Purge permission."
            exit 1
          fi
          npm run purge:cloudflare
