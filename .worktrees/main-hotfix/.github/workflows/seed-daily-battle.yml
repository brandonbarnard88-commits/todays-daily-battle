# Seed daily_battles: ensure today's verse exists every day at midnight UTC.
# Requires: Add SUPABASE_URL as repo secret (e.g. https://xxxx.supabase.co)
# Deploy seed-daily-battle first: npx supabase functions deploy seed-daily-battle
name: Seed Daily Battle

on:
  schedule:
    - cron: '5 0 * * *'  # 00:05 UTC daily (just after midnight)
  workflow_dispatch:      # Allow manual run

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call seed-daily-battle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Add SUPABASE_URL repo secret (e.g. https://xxxx.supabase.co)"
            exit 1
          fi
          FUNC_URL="${SUPABASE_URL%/}/functions/v1/seed-daily-battle"
          echo "Calling $FUNC_URL"
          res=$(curl -sS -w "\n%{http_code}" -X POST "$FUNC_URL" -H "Content-Type: application/json" -d '{}')
          code=$(echo "$res" | tail -n1)
          body=$(echo "$res" | sed '$d')
          echo "Response ($code): $body"
          if [ "$code" != "200" ]; then
            echo "Failed to seed daily battle"
            exit 1
          fi
