<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Stylized night sky with soft light">
  <defs>
    <linearGradient id="ps-night" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="ps-night-ray" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="rgba(186, 210, 255, 0.2)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" fill="url(#ps-night)"/>
  <rect width="320" height="200" fill="url(#ps-night-ray)"/>
  <circle cx="72" cy="88" r="1.5" fill="#e2e8f0" opacity="0.45"/>
  <circle cx="248" cy="64" r="1.2" fill="#e2e8f0" opacity="0.35"/>
  <circle cx="196" cy="112" r="1" fill="#e2e8f0" opacity="0.3"/>
