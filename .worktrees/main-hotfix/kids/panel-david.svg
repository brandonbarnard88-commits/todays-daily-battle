<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="David with sling - be brave">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#87CEEB"/><stop offset="1" stop-color="#E0F6FF"/></linearGradient>
    <linearGradient id="tunic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A90D9"/><stop offset="1" stop-color="#2E5A8A"/></linearGradient>
  </defs>
  <rect width="200" height="160" fill="url(#sky)"/>
  <rect x="0" y="100" width="200" height="60" fill="#8B7355"/>
  <!-- David - simple comic figure -->
  <ellipse cx="100" cy="85" rx="25" ry="28" fill="#F5DEB3" stroke="#333" stroke-width="2"/>
  <circle cx="95" cy="78" r="3" fill="#333"/>
  <circle cx="105" cy="78" r="3" fill="#333"/>
  <path d="M92 92 Q100 96 108 92" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M75 70 L75 110 L85 110 L85 70 Z" fill="url(#tunic)" stroke="#333" stroke-width="2"/>
  <path d="M115 70 L115 110 L125 110 L125 70 Z" fill="url(#tunic)" stroke="#333" stroke-width="2"/>
  <ellipse cx="100" cy="125" rx="22" ry="8" fill="#8B4513" stroke="#333" stroke-width="1"/>
  <!-- Sling -->
  <path d="M85 75 Q60 60 50 85" stroke="#5D4E37" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="85" r="8" fill="#8B4513" stroke="#333" stroke-width="1"/>
  <!-- Speech bubble -->
  <path d="M130 50 L160 50 L165 65 L155 70 L130 70 Z" fill="white" stroke="#333" stroke-width="2"/>
  <text x="135" y="62" font-family="Comic Sans MS, cursive" font-size="10" fill="#333">Be brave!</text>
</svg>
