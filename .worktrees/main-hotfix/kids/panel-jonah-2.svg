<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Jonah and the big fish">
  <defs>
    <linearGradient id="j2-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0d1b2a"/></linearGradient>
    <linearGradient id="j2-fish" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a9aa8"/><stop offset="0.5" stop-color="#7eb8c4"/><stop offset="1" stop-color="#4a7d8a"/></linearGradient>
    <linearGradient id="j2-robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A90D9"/><stop offset="1" stop-color="#2E5A8A"/></linearGradient>
  </defs>
  <rect width="200" height="160" fill="url(#j2-sea)"/>
  <!-- Bubbles -->
  <circle cx="40" cy="50" r="5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="160" cy="80" r="4" fill="rgba(255,255,255,0.3)"/>
  <circle cx="80" cy="130" r="6" fill="rgba(255,255,255,0.35)"/>
  <!-- Big fish / whale body -->
  <ellipse cx="100" cy="85" rx="75" ry="45" fill="url(#j2-fish)" stroke="#3d6b78" stroke-width="2"/>
  <path d="M25 85 Q5 70 15 50 Q25 65 25 85" fill="url(#j2-fish)" stroke="#3d6b78" stroke-width="1"/>
  <path d="M175 85 Q195 70 185 50 Q175 65 175 85" fill="url(#j2-fish)" stroke="#3d6b78" stroke-width="1"/>
  <circle cx="165" cy="80" r="8" fill="#2d4a52"/>
  <circle cx="168" cy="77" r="2" fill="white"/>
  <!-- Jonah inside (visible through "mouth" opening) -->
  <ellipse cx="55" cy="85" rx="18" ry="22" fill="#F5DEB3" stroke="#333" stroke-width="1"/>
  <circle cx="50" cy="80" r="2" fill="#333"/>
  <circle cx="60" cy="80" r="2" fill="#333"/>
  <path d="M48 92 Q55 95 62 92" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M37 88 L37 105 L73 105 L73 88 Q55 78 37 88" fill="url(#j2-robe)" stroke="#333" stroke-width="1"/>
  <!-- Speech bubble -->
  <path d="M70 35 L120 35 L125 50 L113 55 L70 55 Z" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="78" y="48" font-family="Comic Sans MS, cursive" font-size="8" fill="#333">God, help me!</text>
</svg>
