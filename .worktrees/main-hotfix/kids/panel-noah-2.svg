<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Animals boarding two by two">
  <defs>
    <linearGradient id="n2-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B4513"/><stop offset="1" stop-color="#A0522D"/></linearGradient>
  </defs>
  <rect width="200" height="160" fill="#5D6D7E"/>
  <!-- Rain -->
  <line x1="20" y1="30" x2="20" y2="50" stroke="#87CEEB" stroke-width="2" opacity="0.8"/>
  <line x1="60" y1="25" x2="60" y2="48" stroke="#87CEEB" stroke-width="2" opacity="0.8"/>
  <line x1="100" y1="35" x2="100" y2="55" stroke="#87CEEB" stroke-width="2" opacity="0.8"/>
  <line x1="140" y1="28" x2="140" y2="50" stroke="#87CEEB" stroke-width="2" opacity="0.8"/>
  <line x1="180" y1="32" x2="180" y2="52" stroke="#87CEEB" stroke-width="2" opacity="0.8"/>
  <!-- Ark -->
  <rect x="30" y="90" width="140" height="50" rx="5" fill="url(#n2-wood)" stroke="#5D4E37" stroke-width="2"/>
  <rect x="50" y="75" width="100" height="25" fill="url(#n2-wood)" stroke="#5D4E37" stroke-width="1"/>
  <!-- Animals boarding -->
  <ellipse cx="70" cy="115" rx="12" ry="8" fill="#8B4513"/>
  <ellipse cx="100" cy="110" rx="10" ry="6" fill="#FFF" stroke="#333" stroke-width="1"/>
  <ellipse cx="130" cy="115" rx="8" ry="10" fill="#F5DEB3"/>
  <circle cx="155" cy="108" r="6" fill="#333"/>
  <!-- Waves -->
  <path d="M0 145 Q50 135 100 145 Q150 155 200 145 L200 160 L0 160 Z" fill="#3498DB" opacity="0.7"/>
  <!-- Speech bubble -->
  <path d="M70 45 L130 45 L135 60 L122 65 L70 65 Z" fill="white" stroke="#333" stroke-width="2"/>
  <text x="78" y="56" font-family="Comic Sans MS, cursive" font-size="9" fill="#333">Two by two!</text>
</svg>
