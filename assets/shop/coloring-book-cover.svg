<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1018"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#e8c96e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <line x1="0" y1="60" x2="900" y2="60" stroke="rgba(201,168,76,0.07)" stroke-width="1"/>
  <line x1="0" y1="540" x2="900" y2="540" stroke="rgba(201,168,76,0.07)" stroke-width="1"/>
  <line x1="60" y1="0" x2="60" y2="600" stroke="rgba(201,168,76,0.07)" stroke-width="1"/>
  <line x1="840" y1="0" x2="840" y2="600" stroke="rgba(201,168,76,0.07)" stroke-width="1"/>

  <!-- Preview panel: simulated coloring page thumbnails (3 mini frames) -->
  <!-- Frame 1: Creation -->
  <rect x="80" y="120" width="200" height="150" rx="10" fill="#fff" stroke="rgba(201,168,76,0.4)" stroke-width="1.5"/>
  <!-- Mini creation scene: sun, waves, light -->
  <circle cx="155" cy="155" r="28" fill="none" stroke="#111" stroke-width="2.5"/>
  <path d="M80,230 Q130,210 180,230 Q230,250 280,226" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <path d="M80,245 Q130,226 180,245 Q230,264 280,240" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M80,260 Q130,242 180,260 Q230,278 280,255" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
  <text x="180" y="282" font-family="Georgia,serif" font-size="11" fill="#555" text-anchor="middle">Creation</text>

  <!-- Frame 2: David & Goliath -->
  <rect x="350" y="120" width="200" height="150" rx="10" fill="#fff" stroke="rgba(201,168,76,0.4)" stroke-width="1.5"/>
  <!-- Mini David scene: small figure, large figure -->
  <circle cx="403" cy="153" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="403" y1="165" x2="403" y2="210" stroke="#111" stroke-width="2"/>
  <line x1="403" y1="182" x2="388" y2="198" stroke="#111" stroke-width="2"/>
  <line x1="403" y1="182" x2="418" y2="198" stroke="#111" stroke-width="2"/>
  <circle cx="495" cy="143" r="18" fill="none" stroke="#111" stroke-width="2.5"/>
  <line x1="495" y1="161" x2="495" y2="225" stroke="#111" stroke-width="2.5"/>
  <line x1="495" y1="185" x2="475" y2="208" stroke="#111" stroke-width="2.5"/>
  <line x1="495" y1="185" x2="515" y2="208" stroke="#111" stroke-width="2.5"/>
  <circle cx="448" cy="195" r="7" fill="none" stroke="#111" stroke-width="2"/>
  <text x="450" y="282" font-family="Georgia,serif" font-size="11" fill="#555" text-anchor="middle">David &amp; Goliath</text>

  <!-- Frame 3: Empty Tomb -->
  <rect x="620" y="120" width="200" height="150" rx="10" fill="#fff" stroke="rgba(201,168,76,0.4)" stroke-width="1.5"/>
  <!-- Mini empty tomb scene -->
  <path d="M680,245 Q720,170 760,245 Z" fill="none" stroke="#111" stroke-width="2"/>
  <ellipse cx="720" cy="245" rx="40" ry="8" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="800" cy="180" r="22" fill="none" stroke="#111" stroke-width="2.5"/>
  <path d="M790,172 L800,166 L810,172 M800,166 L800,155" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- rays -->
  <line x1="800" y1="150" x2="800" y2="140" stroke="#333" stroke-width="1.5"/>
  <line x1="814" y1="155" x2="822" y2="147" stroke="#333" stroke-width="1.5"/>
  <line x1="786" y1="155" x2="778" y2="147" stroke="#333" stroke-width="1.5"/>
  <text x="720" y="282" font-family="Georgia,serif" font-size="11" fill="#555" text-anchor="middle">The Empty Tomb</text>

  <!-- Gold divider line -->
  <line x1="80" y1="320" x2="820" y2="320" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Title block -->
  <text x="450" y="365" font-family="Georgia,'Times New Roman',serif" font-size="32" font-weight="700" fill="#f0e8d0" text-anchor="middle">Color &amp; Tell</text>
  <text x="450" y="395" font-family="Georgia,serif" font-size="15" fill="rgba(201,168,76,0.9)" text-anchor="middle">83 Bible Stories · KJV Line Art</text>

  <!-- Verse -->
  <text x="450" y="435" font-family="Georgia,serif" font-size="11" font-style="italic" fill="rgba(200,210,230,0.7)" text-anchor="middle">"Let the children come unto me"  Mark 10:14 (KJV)</text>

  <!-- Site name -->
  <text x="450" y="478" font-family="Georgia,serif" font-size="10" fill="rgba(201,168,76,0.55)" text-anchor="middle" letter-spacing="0.08em">TODAYSDAILYBATTLE.COM · FREE · NO ADS · OFFLINE-FIRST</text>

  <!-- Corner decoration -->
  <rect x="80" y="500" width="740" height="1" fill="rgba(201,168,76,0.2)"/>
  <text x="80" y="525" font-family="Georgia,serif" font-size="9" fill="rgba(200,210,230,0.4)">Old Testament · Gospels · Acts · 83 stories · 332 scenes</text>
  <text x="820" y="525" font-family="Georgia,serif" font-size="9" fill="rgba(200,210,230,0.4)" text-anchor="end">Print · Color · Keep</text>
</svg>
