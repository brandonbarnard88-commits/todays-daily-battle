  <path d="M174,490 Q154,476 148,456 Q162,448 176,460 Q178,444 174,428 Q188,432 192,450 Q200,436 210,446 Q208,462 196,466 Q208,470 210,486 Q198,494 186,486 Q186,494 180,500 Z" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
