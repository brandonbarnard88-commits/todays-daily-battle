  <line x1="390" y1="290" x2="390" y2="308" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <!-- Antennae -->
  <path d="M390,290 Q384,278 378,270" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <path d="M390,290 Q396,278 402,270" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <circle cx="376" cy="268" r="4" fill="none" stroke="#111" stroke-width="6"/>
  <circle cx="404" cy="268" r="4" fill="none" stroke="#111" stroke-width="6"/>

