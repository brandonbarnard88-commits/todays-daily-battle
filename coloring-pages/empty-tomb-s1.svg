  <path d="M586,504 Q566,490 560,470 Q574,462 588,474 Q590,458 586,442 Q600,446 604,464 Q612,450 622,460 Q620,476 608,480 Q620,484 622,500 Q610,508 598,500 Q598,508 592,514 Z" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
