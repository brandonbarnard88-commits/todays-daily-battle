<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c14"/>
      <stop offset="100%" style="stop-color:#101828"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c96e"/>
      <stop offset="100%" style="stop-color:#a07830"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg3)"/>

  <!-- Armor of God shield silhouette (line art, coloring-book style) -->
  <!-- Main shield -->
  <path d="M450 80 L620 140 L620 310 Q620 410 450 480 Q280 410 280 310 L280 140 Z"
        fill="none" stroke="rgba(240,232,208,0.7)" stroke-width="3" stroke-linejoin="round"/>
  <!-- Inner shield line -->
  <path d="M450 108 L596 160 L596 308 Q596 396 450 456 Q304 396 304 308 L304 160 Z"
        fill="none" stroke="rgba(201,168,76,0.45)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Cross on shield -->
  <line x1="450" y1="160" x2="450" y2="420" stroke="rgba(201,168,76,0.8)" stroke-width="4" stroke-linecap="round"/>
  <line x1="330" y1="270" x2="570" y2="270" stroke="rgba(201,168,76,0.8)" stroke-width="4" stroke-linecap="round"/>

  <!-- Sword (simplified, vertical) -->
  <line x1="690" y1="100" x2="690" y2="430" stroke="rgba(240,232,208,0.75)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Guard -->
  <line x1="660" y1="200" x2="720" y2="200" stroke="rgba(240,232,208,0.75)" stroke-width="4" stroke-linecap="round"/>
  <!-- Pommel -->
  <circle cx="690" cy="440" r="12" fill="none" stroke="rgba(240,232,208,0.75)" stroke-width="3"/>
  <!-- Blade tip -->
  <path d="M684 100 L690 80 L696 100" fill="none" stroke="rgba(240,232,208,0.75)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Helmet silhouette (right side) -->
  <path d="M150 170 Q150 100 220 95 Q290 90 290 160 L290 240 Q260 255 220 255 Q180 255 150 240 Z"
        fill="none" stroke="rgba(240,232,208,0.65)" stroke-width="3" stroke-linejoin="round"/>
  <!-- Visor -->
  <path d="M155 195 Q210 180 285 195" fill="none" stroke="rgba(201,168,76,0.5)" stroke-width="2" stroke-linecap="round"/>

  <!-- Light rays at top -->
  <line x1="450" y1="50" x2="450" y2="30" stroke="rgba(201,168,76,0.4)" stroke-width="1.5"/>
  <line x1="480" y1="55" x2="496" y2="38" stroke="rgba(201,168,76,0.35)" stroke-width="1.5"/>
  <line x1="420" y1="55" x2="404" y2="38" stroke="rgba(201,168,76,0.35)" stroke-width="1.5"/>
  <line x1="506" y1="68" x2="524" y2="55" stroke="rgba(201,168,76,0.25)" stroke-width="1.5"/>
  <line x1="394" y1="68" x2="376" y2="55" stroke="rgba(201,168,76,0.25)" stroke-width="1.5"/>

  <!-- Title at bottom -->
  <text x="450" y="515" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="700" fill="#f0e8d0" text-anchor="middle">Battle Plans</text>
  <text x="450" y="544" font-family="Georgia,serif" font-size="12.5" fill="rgba(201,168,76,0.85)" text-anchor="middle">KJV scripture plans for real battles</text>
  <text x="450" y="572" font-family="Georgia,serif" font-size="10" fill="rgba(200,210,230,0.4)" text-anchor="middle" letter-spacing="0.06em">TODAYSDAILYBATTLE.COM · 76+ PLANS · FREE</text>
</svg>
