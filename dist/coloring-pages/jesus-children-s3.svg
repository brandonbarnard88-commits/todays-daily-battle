  <path d="M728,308 Q702,312 680,324 Q664,336 660,366 Q656,400 658,442 Q660,478 664,508 Q700,524 740,526 Q780,524 816,508 Q820,478 822,442 Q824,400 820,366 Q816,336 800,324 Q778,312 752,308" fill="none" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
