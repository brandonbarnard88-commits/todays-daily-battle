  <path d="M742,248 Q749,243 756,248" fill="none" stroke="#0d0d0d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M730,260 Q740,268 750,260" fill="none" stroke="#0d0d0d" stroke-width="2.5" stroke-linecap="round"/>
