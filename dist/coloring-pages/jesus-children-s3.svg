  <path d="M506,385 Q468,389 438,403 C414,419 402,451 398,495 C394,535 400,565 406,578 Q462,596 520,598 Q578,596 634,578 C640,565 646,535 642,495 C638,451 626,419 602,403 Q572,389 534,385" fill="none" stroke="#0a0a0a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
