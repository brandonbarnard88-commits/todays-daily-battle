  <!-- Wing feather tips -->
  <path d="M368,260 Q372,272 382,272" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <path d="M380,256 Q386,268 396,270" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <path d="M396,252 Q404,264 412,266" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <!-- Dove tail fan -->
  <path d="M416,280 Q424,298 416,308 Q406,296 410,280" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M418,280 Q432,300 426,312 Q416,300 418,280" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M420,278 Q438,296 434,310 Q424,298 422,278" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- NOAH FIGURE on deck (small but detailed silhouette) -->
  <!-- Head -->
  <circle cx="326" cy="274" r="18" fill="none" stroke="#111" stroke-width="13"/>
  <!-- Hair/beard rough mass -->
  <path d="M308,268 Q310,252 326,246 Q342,252 344,268" fill="none" stroke="#111" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M308,278 Q310,290 322,296 Q334,292 340,278" fill="none" stroke="#111" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eyes -->
  <path d="M318,272 Q324,267 330,272" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <!-- Robe body -->
  <path d="M308,292 Q296,302 292,320 Q290,334 292,350 Q310,354 326,356 Q342,354 360,350 Q362,334 360,320 Q356,302 344,292" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arms raised praising -->
  <path d="M296,302 Q276,288 268,272 Q276,262 288,266 Q296,278 298,296" fill="none" stroke="#111" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M356,302 Q374,288 382,272 Q374,262 362,266 Q354,278 352,296" fill="none" stroke="#111" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- SECOND FAMILY MEMBER on deck -->
  <circle cx="526" cy="277" r="16" fill="none" stroke="#111" stroke-width="12"/>
  <path d="M510,264 Q512,250 526,244 Q540,250 542,264" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M512,292 Q500,302 498,320 Q498,334 500,350 Q514,354 526,356 Q538,354 554,350 Q556,334 554,320 Q552,302 540,292" fill="none" stroke="#111" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ANIMAL PAIR on deck — dove returning suggests other animals visible -->
  <!-- Giraffe neck peeking over cabin roof on right -->
  <path d="M664,286 Q668,256 672,224 Q676,200 680,186" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round"/>
  <path d="M674,286 Q678,256 684,224 Q688,200 692,186" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round"/>
  <!-- Giraffe head -->
  <ellipse cx="686" cy="180" rx="18" ry="14" fill="none" stroke="#111" stroke-width="13"/>
  <!-- Giraffe ossicones -->
  <line x1="679" y1="167" x2="676" y2="152" stroke="#111" stroke-width="9" stroke-linecap="round"/>
  <circle cx="676" cy="150" r="5" fill="none" stroke="#111" stroke-width="9"/>
  <line x1="690" y1="168" x2="694" y2="154" stroke="#111" stroke-width="9" stroke-linecap="round"/>
  <circle cx="694" cy="152" r="5" fill="none" stroke="#111" stroke-width="9"/>
  <!-- Giraffe eye -->
  <circle cx="693" cy="178" r="5" fill="none" stroke="#111" stroke-width="8"/>
  <!-- Giraffe spots on neck -->
  <path d="M666,248 Q670,244 676,248 Q672,254 666,250" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M672,224 Q678,220 684,224 Q680,230 674,226" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
