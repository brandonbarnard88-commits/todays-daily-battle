  <circle cx="482" cy="256" r="14" fill="none" stroke="#111" stroke-width="13"/>
  <!-- Dove eye -->
  <circle cx="486" cy="253" r="4" fill="none" stroke="#111" stroke-width="8"/>
  <!-- Dove beak with branch -->
  <path d="M496,260 Q508,258 520,252" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <!-- Olive branch from beak -->
  <path d="M520,252 Q534,244 548,250 Q540,262 524,258" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Olive leaves -->
  <path d="M528,244 Q532,236 540,242 Q536,252 528,248" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M540,248 Q548,240 554,248 Q550,256 542,254" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dove left wing spread (descending) -->
