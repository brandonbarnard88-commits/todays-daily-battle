  <path d="M84,516 Q450,112 816,516" fill="none" stroke="#111" stroke-width="11" stroke-linecap="round"/>
  <!-- Arc 5 innermost (blue/violet) -->
  <path d="M112,528 Q450,164 788,528" fill="none" stroke="#111" stroke-width="9" stroke-linecap="round"/>

