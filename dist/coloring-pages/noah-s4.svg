  <line x1="566" y1="308" x2="566" y2="346" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <line x1="540" y1="327" x2="592" y2="327" stroke="#111" stroke-width="7" stroke-linecap="round"/>

