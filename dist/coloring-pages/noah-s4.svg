  <circle cx="178" cy="162" r="42" fill="none" stroke="#111" stroke-width="16"/>
  <circle cx="222" cy="142" r="36" fill="none" stroke="#111" stroke-width="16"/>
  <circle cx="262" cy="154" r="32" fill="none" stroke="#111" stroke-width="16"/>
  <circle cx="140" cy="176" r="30" fill="none" stroke="#111" stroke-width="14"/>
  <path d="M108,196 Q180,210 296,196" fill="none" stroke="#111" stroke-width="16" stroke-linecap="round"/>

  <!-- CLOUDS right group -->
  <circle cx="722" cy="158" r="42" fill="none" stroke="#111" stroke-width="16"/>
  <circle cx="678" cy="138" r="36" fill="none" stroke="#111" stroke-width="16"/>
