  <path d="M450,354 L450,452" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <path d="M540,354 Q544,394 550,440" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <path d="M610,356 Q614,396 620,442" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>

