<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0e1420"/>
      <stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="480" fill="url(#bg)"/>

  <!-- Subtle paper texture lines -->
  <line x1="0" y1="48" x2="720" y2="48" stroke="rgba(163,139,110,0.06)" stroke-width="1"/>
  <line x1="0" y1="432" x2="720" y2="432" stroke="rgba(163,139,110,0.06)" stroke-width="1"/>

  <!-- Three mini coloring scene frames arranged as an open book spread -->
  <!-- Left page frame -->
  <rect x="60" y="80" width="176" height="240" rx="6" fill="#fafaf8" stroke="rgba(163,139,110,0.35)" stroke-width="1.2"/>
  <!-- Creation mini scene: sun + rolling waves + land -->
  <circle cx="115" cy="120" r="22" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <!-- sun rays -->
  <line x1="115" y1="93" x2="115" y2="84" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="130" y1="98" x2="137" y2="91" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="137" y1="113" x2="146" y2="113" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="100" y1="98" x2="93" y2="91" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="93" y1="113" x2="84" y2="113" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- ground/hills -->
  <path d="M64,200 Q90,168 116,178 Q142,188 165,168 Q188,148 214,165" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- water waves -->
  <path d="M64,218 Q90,208 116,218 Q142,228 168,218 Q194,208 220,218" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M64,232 Q90,222 116,232 Q142,242 168,232 Q194,222 220,232" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- tree -->
  <line x1="180" y1="200" x2="180" y2="155" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M160,168 Q180,140 200,168 Z" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M155,185 Q180,158 205,185 Z" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
  <!-- caption -->
  <text x="148" y="294" font-family="Georgia,serif" font-size="9.5" fill="#666" text-anchor="middle">Creation</text>
  <text x="148" y="308" font-family="Georgia,serif" font-size="8" fill="#999" text-anchor="middle" font-style="italic">Genesis 1 (KJV)</text>

  <!-- Center spine shadow -->
  <rect x="244" y="80" width="8" height="240" fill="rgba(0,0,0,0.18)" rx="2"/>
  <line x1="248" y1="80" x2="248" y2="320" stroke="rgba(163,139,110,0.2)" stroke-width="1"/>

  <!-- Right page frame -->
  <rect x="252" y="80" width="176" height="240" rx="6" fill="#fafaf8" stroke="rgba(163,139,110,0.35)" stroke-width="1.2"/>
  <!-- Daniel in lions den mini scene -->
  <!-- Daniel praying figure -->
  <circle cx="300" cy="125" r="13" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M300 138 L300 185" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M300 155 L282 170" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M300 155 L318 170" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- hands raised -->
  <path d="M282 170 L278 160" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M318 170 L322 160" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Lion left -->
  <path d="M262 205 Q252 188 262 178 Q278 168 288 185 Q296 198 285 210 Z" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="268" cy="185" r="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Lion right -->
  <path d="M330 205 Q320 188 330 178 Q346 168 356 185 Q364 198 353 210 Z" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="350" cy="185" r="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- cave arch -->
  <path d="M254 240 Q340 220 424 240" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="254" y1="240" x2="254" y2="310" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="424" y1="240" x2="424" y2="310" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <text x="340" y="294" font-family="Georgia,serif" font-size="9.5" fill="#666" text-anchor="middle">Daniel in the Lions&apos; Den</text>
  <text x="340" y="308" font-family="Georgia,serif" font-size="8" fill="#999" text-anchor="middle" font-style="italic">Daniel 6 (KJV)</text>

  <!-- Third frame  —  right side standalone -->
  <rect x="444" y="80" width="176" height="240" rx="6" fill="#fafaf8" stroke="rgba(163,139,110,0.35)" stroke-width="1.2"/>
  <!-- Empty tomb scene -->
  <!-- Stone rolled away -->
  <ellipse cx="530" cy="235" rx="34" ry="34" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <!-- crack on stone -->
  <path d="M518 218 L527 228 L520 238" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tomb opening -->
  <path d="M490 285 Q532 240 574 285" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="490" y1="285" x2="490" y2="310" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="574" y1="285" x2="574" y2="310" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- light rays from tomb -->
  <line x1="532" y1="210" x2="532" y2="150" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/>
  <line x1="552" y1="215" x2="580" y2="158" stroke="#444" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 5"/>
  <line x1="512" y1="215" x2="484" y2="158" stroke="#444" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 5"/>
  <!-- angel figure suggested -->
  <circle cx="532" cy="130" r="11" fill="none" stroke="#333" stroke-width="1.8"/>
  <path d="M532 141 L532 165" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <text x="532" y="294" font-family="Georgia,serif" font-size="9.5" fill="#666" text-anchor="middle">The Empty Tomb</text>
  <text x="532" y="308" font-family="Georgia,serif" font-size="8" fill="#999" text-anchor="middle" font-style="italic">Matthew 28 (KJV)</text>

  <!-- Title block -->
  <text x="360" y="358" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#d4c4a8" text-anchor="middle" letter-spacing="0.5">Color &amp; Tell</text>
  <text x="360" y="382" font-family="Georgia,serif" font-size="12" fill="rgba(163,139,110,0.85)" text-anchor="middle">83 Bible Stories · KJV Line Art Coloring Book</text>
  <line x1="200" y1="396" x2="520" y2="396" stroke="rgba(163,139,110,0.3)" stroke-width="1"/>
  <text x="360" y="416" font-family="Georgia,serif" font-size="10" font-style="italic" fill="rgba(200,210,230,0.45)" text-anchor="middle">"Let the little children come unto me."  —  Mark 10:14 (KJV)</text>
  <text x="360" y="456" font-family="Georgia,serif" font-size="8.5" fill="rgba(163,139,110,0.4)" text-anchor="middle" letter-spacing="0.1em">TODAYSDAILYBATTLE.COM · FREE · OFFLINE-FIRST · NO ADS</text>
</svg>
