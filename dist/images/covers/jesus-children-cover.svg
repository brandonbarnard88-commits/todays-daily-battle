<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0e1520"/>
      <stop offset="100%" stop-color="#1c2234"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="rgba(212,196,168,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="720" height="480" fill="url(#bg)"/>
  <rect width="720" height="480" fill="url(#glow)"/>

  <!-- White page area  scene drawn on it -->
  <rect x="80" y="60" width="560" height="320" rx="8" fill="#f8f7f4" stroke="rgba(163,139,110,0.3)" stroke-width="1.5"/>

  <!-- Gentle hills / ground background -->
  <path d="M80,310 Q200,270 360,290 Q520,310 640,275 L640,380 L80,380 Z" fill="#eeeae4" stroke="none"/>
  <!-- distant hills -->
  <path d="M80,280 Q180,250 280,265 Q380,280 480,255 Q560,235 640,250" fill="none" stroke="#ccc5b8" stroke-width="1.5"/>

  <!-- Jesus figure (center, seated/kneeling, arms open) -->
  <!-- Head -->
  <circle cx="360" cy="148" r="28" fill="none" stroke="#2a2218" stroke-width="2.8"/>
  <!-- Simple hair lines -->
  <path d="M340 135 Q360 122 380 135" fill="none" stroke="#2a2218" stroke-width="2" stroke-linecap="round"/>
  <!-- Robe body -->
  <path d="M360 176 Q330 195 320 260 Q315 300 340 305 Q360 308 380 305 Q405 300 400 260 Q390 195 360 176 Z" fill="none" stroke="#2a2218" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Belt line -->
  <path d="M324 224 Q360 216 396 224" fill="none" stroke="#2a2218" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left arm extended to child -->
  <path d="M324 205 Q285 215 252 240" fill="none" stroke="#2a2218" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right arm extended to child -->
  <path d="M396 205 Q435 215 468 240" fill="none" stroke="#2a2218" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Child left  small, running toward Jesus -->
  <circle cx="210" cy="228" r="16" fill="none" stroke="#2a2218" stroke-width="2"/>
  <path d="M210 244 L210 295" stroke="#2a2218" stroke-width="2" stroke-linecap="round"/>
  <path d="M210 262 L194 278" stroke="#2a2218" stroke-width="2" stroke-linecap="round"/>
  <path d="M210 262 L226 272" stroke="#2a2218" stroke-width="2" stroke-linecap="round"/>
  <path d="M210 295 L196 318" stroke="#2a2218" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M210 295 L224 318" stroke="#2a2218" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Child right  arms raised -->
  <circle cx="510" cy="228" r="16" fill="none" stroke="#2a2218" stroke-width="2"/>
  <path d="M510 244 L510 295" stroke="#2a2218" stroke-width="2" stroke-linecap="round"/>
  <path d="M510 262 L490 250" stroke="#2a2218" stroke-width="2" stroke-linecap="round"/>
  <path d="M510 262 L530 250" stroke="#2a2218" stroke-width="2" stroke-linecap="round"/>
  <path d="M510 295 L496 318" stroke="#2a2218" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M510 295 L524 318" stroke="#2a2218" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Child center  held/seated near Jesus -->
  <circle cx="360" cy="265" r="13" fill="none" stroke="#2a2218" stroke-width="2"/>
  <path d="M360 278 L360 310" stroke="#2a2218" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Small child far left  toddler, very small -->
  <circle cx="152" cy="268" r="11" fill="none" stroke="#2a2218" stroke-width="1.8"/>
  <path d="M152 279 L152 308" stroke="#2a2218" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M152 290 L140 300" stroke="#2a2218" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M152 290 L164 300" stroke="#2a2218" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Small child far right -->
  <circle cx="568" cy="262" r="11" fill="none" stroke="#2a2218" stroke-width="1.8"/>
  <path d="M568 273 L568 302" stroke="#2a2218" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M568 284 L556 294" stroke="#2a2218" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M568 284 L580 294" stroke="#2a2218" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ground line -->
  <line x1="80" y1="330" x2="640" y2="330" stroke="#ccc5b8" stroke-width="1"/>

  <!-- KJV verse below the scene (on white) -->
  <text x="360" y="354" font-family="Georgia,serif" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">"Suffer the little children to come unto me."  Mark 10:14 (KJV)</text>

  <!-- Title block (on dark background) -->
  <text x="360" y="415" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="700" fill="#d4c4a8" text-anchor="middle">Jesus &amp; the Children</text>
  <text x="360" y="440" font-family="Georgia,serif" font-size="11.5" fill="rgba(163,139,110,0.8)" text-anchor="middle">Five gentle stories for young hearts</text>
  <text x="360" y="463" font-family="Georgia,serif" font-size="8.5" fill="rgba(163,139,110,0.38)" text-anchor="middle" letter-spacing="0.08em">TODAYSDAILYBATTLE.COM · FREE TO PRINT · KJV ONLY</text>
</svg>
