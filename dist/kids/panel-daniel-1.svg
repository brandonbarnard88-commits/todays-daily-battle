<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Daniel praying">
  <defs>
    <linearGradient id="d1-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3e50"/><stop offset="1" stop-color="#34495e"/></linearGradient>
    <linearGradient id="d1-robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B4513"/><stop offset="1" stop-color="#5D3A1A"/></linearGradient>
  </defs>
  <rect width="200" height="160" fill="url(#d1-sky)"/>
  <rect x="0" y="110" width="200" height="50" fill="#4a3728"/>
  <!-- Window frame -->
  <rect x="60" y="50" width="80" height="70" fill="#1a1a2e" stroke="#8B7355" stroke-width="2"/>
  <rect x="65" y="55" width="70" height="60" fill="#87CEEB"/>
  <!-- Daniel kneeling, praying -->
  <ellipse cx="100" cy="95" rx="20" ry="24" fill="#F5DEB3" stroke="#333" stroke-width="1.5"/>
  <circle cx="95" cy="90" r="2.5" fill="#333"/>
  <circle cx="105" cy="90" r="2.5" fill="#333"/>
  <path d="M93 102 Q100 106 107 102" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M80 95 L80 125 L120 125 L120 95 Q100 85 80 95" fill="url(#d1-robe)" stroke="#333" stroke-width="1"/>
  <!-- Kneeling legs -->
  <path d="M85 125 L85 140 L95 140 L95 125 Z" fill="url(#d1-robe)" stroke="#333" stroke-width="1"/>
  <path d="M105 125 L105 140 L115 140 L115 125 Z" fill="url(#d1-robe)" stroke="#333" stroke-width="1"/>
  <!-- Hands folded in prayer -->
  <path d="M88 100 L92 100 L92 108 L88 108 Z" fill="#F5DEB3" stroke="#333" stroke-width="1"/>
  <path d="M108 100 L112 100 L112 108 L108 108 Z" fill="#F5DEB3" stroke="#333" stroke-width="1"/>
  <!-- Speech bubble -->
  <path d="M70 35 L130 35 L135 50 L122 55 L70 55 Z" fill="white" stroke="#333" stroke-width="2"/>
  <text x="78" y="48" font-family="Comic Sans MS, cursive" font-size="9" fill="#333">Praying to God!</text>
</svg>
