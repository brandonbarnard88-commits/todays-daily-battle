<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="David as shepherd boy">
  <defs>
    <linearGradient id="d1-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#87CEEB"/><stop offset="1" stop-color="#E0F6FF"/></linearGradient>
    <linearGradient id="d1-tunic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A90D9"/><stop offset="1" stop-color="#2E5A8A"/></linearGradient>
  </defs>
  <rect width="200" height="160" fill="url(#d1-sky)"/>
  <rect x="0" y="100" width="200" height="60" fill="#6B8E23"/>
  <!-- Hills -->
  <ellipse cx="50" cy="115" rx="35" ry="25" fill="#7BA05B"/>
  <ellipse cx="150" cy="110" rx="40" ry="30" fill="#8FBC8F"/>
  <!-- David - shepherd pose with staff -->
  <ellipse cx="100" cy="85" rx="25" ry="28" fill="#F5DEB3" stroke="#333" stroke-width="2"/>
  <circle cx="95" cy="78" r="3" fill="#333"/>
  <circle cx="105" cy="78" r="3" fill="#333"/>
  <path d="M92 92 Q100 96 108 92" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M75 70 L75 110 L85 110 L85 70 Z" fill="url(#d1-tunic)" stroke="#333" stroke-width="2"/>
  <path d="M115 70 L115 110 L125 110 L125 70 Z" fill="url(#d1-tunic)" stroke="#333" stroke-width="2"/>
  <ellipse cx="100" cy="125" rx="22" ry="8" fill="#8B4513" stroke="#333" stroke-width="1"/>
  <!-- Staff -->
  <line x1="75" y1="95" x2="55" y2="55" stroke="#5D4E37" stroke-width="4" stroke-linecap="round"/>
  <!-- Sheep -->
  <ellipse cx="140" cy="115" rx="18" ry="12" fill="#F5F5DC" stroke="#8B7355" stroke-width="1"/>
  <circle cx="135" cy="112" r="3" fill="#333"/>
  <ellipse cx="155" cy="120" rx="12" ry="8" fill="#F5F5DC" stroke="#8B7355" stroke-width="1"/>
  <!-- Speech bubble -->
  <path d="M130 45 L165 45 L170 60 L158 65 L130 65 Z" fill="white" stroke="#333" stroke-width="2"/>
  <text x="135" y="57" font-family="Comic Sans MS, cursive" font-size="9" fill="#333">I watch the sheep!</text>
</svg>
