<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Jesus calling the children">
  <defs>
    <linearGradient id="j2-robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5F5DC"/><stop offset="1" stop-color="#DEB887"/></linearGradient>
    <radialGradient id="j2-glow"><stop offset="0" stop-color="#FFE4B5"/><stop offset="1" stop-color="#F5DEB3"/></radialGradient>
  </defs>
  <rect width="200" height="160" fill="#E8F4F8"/>
  <!-- Jesus figure - arms open, welcoming -->
  <ellipse cx="100" cy="75" rx="28" ry="30" fill="url(#j2-glow)" stroke="#8B7355" stroke-width="1.5"/>
  <circle cx="94" cy="70" r="2.5" fill="#333"/>
  <circle cx="106" cy="70" r="2.5" fill="#333"/>
  <path d="M92 82 Q100 86 108 82" stroke="#8B7355" stroke-width="1" fill="none"/>
  <path d="M72 85 L72 140 L128 140 L128 85 Q100 70 72 85" fill="url(#j2-robe)" stroke="#8B7355" stroke-width="1"/>
  <path d="M65 75 L75 95 M135 75 L125 95" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
  <!-- Children running to Him -->
  <circle cx="55" cy="110" r="18" fill="#FFE4C4" stroke="#8B7355" stroke-width="1"/>
  <circle cx="50" cy="105" r="2" fill="#333"/>
  <circle cx="60" cy="105" r="2" fill="#333"/>
  <circle cx="145" cy="110" r="18" fill="#FFE4C4" stroke="#8B7355" stroke-width="1"/>
  <circle cx="140" cy="105" r="2" fill="#333"/>
  <circle cx="150" cy="105" r="2" fill="#333"/>
  <!-- Speech bubble -->
  <path d="M60 35 L140 35 L145 52 L132 58 L60 58 Z" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="100" y="50" font-family="Comic Sans MS, cursive" font-size="9" fill="#333" text-anchor="middle">Come unto me!</text>
</svg>
