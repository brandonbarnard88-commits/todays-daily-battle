<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Jonah and the big fish - obey God">
  <defs>
    <linearGradient id="j-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a5a6a"/><stop offset="1" stop-color="#0d2a35"/></linearGradient>
    <linearGradient id="j-fish" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a9aa8"/><stop offset="0.5" stop-color="#7eb8c4"/><stop offset="1" stop-color="#4a7d8a"/></linearGradient>
    <linearGradient id="j-robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A90D9"/><stop offset="1" stop-color="#2E5A8A"/></linearGradient>
  </defs>
  <rect width="200" height="160" fill="url(#j-sea)"/>
  <circle cx="50" cy="40" r="6" fill="rgba(255,255,255,0.4)"/>
  <circle cx="160" cy="70" r="5" fill="rgba(255,255,255,0.35)"/>
  <!-- Whale / big fish -->
  <ellipse cx="100" cy="85" rx="70" ry="42" fill="url(#j-fish)" stroke="#3d6b78" stroke-width="2"/>
  <path d="M30 85 Q8 68 18 48 Q28 65 30 85" fill="url(#j-fish)" stroke="#3d6b78" stroke-width="1"/>
  <path d="M170 85 Q192 68 182 48 Q172 65 170 85" fill="url(#j-fish)" stroke="#3d6b78" stroke-width="1"/>
  <circle cx="162" cy="80" r="7" fill="#2d4a52"/>
  <circle cx="164" cy="77" r="2" fill="white"/>
  <!-- Jonah (small figure) -->
  <ellipse cx="55" cy="85" rx="14" ry="18" fill="#F5DEB3" stroke="#333" stroke-width="1"/>
  <circle cx="51" cy="81" r="2" fill="#333"/>
  <circle cx="59" cy="81" r="2" fill="#333"/>
  <path d="M49 92 Q55 95 61 92" stroke="#333" stroke-width="0.8" fill="none"/>
  <path d="M41 89 L41 102 L69 102 L69 89 Q55 82 41 89" fill="url(#j-robe)" stroke="#333" stroke-width="0.8"/>
  <!-- Speech bubble -->
  <path d="M75 45 L135 45 L140 60 L128 65 L75 65 Z" fill="white" stroke="#333" stroke-width="2"/>
  <text x="82" y="57" font-family="Comic Sans MS, cursive" font-size="10" fill="#333">Obey God like Jonah!</text>
</svg>
