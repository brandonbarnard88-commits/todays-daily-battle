<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-labelledby="sm-ah-t">
  <title id="sm-ah-t">Little Shepherd celebrates with quiet joy</title>
  <defs>
    <radialGradient id="fg-ah" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
  </defs>
  <!-- robe -->
  <path d="M50,105 C46,124 41,157 39,192 L121,192 C119,157 114,124 110,105 Z" fill="#fef9eb" stroke="#c9a55a" stroke-width="2" stroke-linejoin="round"/>
  <line x1="69" y1="108" x2="63" y2="148" stroke="#c9a55a" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <line x1="91" y1="108" x2="97" y2="148" stroke="#c9a55a" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <!-- both arms high above head — hurray! -->
  <path d="M52,112 Q38,90 28,68" fill="none" stroke="#c9a55a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="27" cy="66" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <path d="M108,112 Q122,90 132,68" fill="none" stroke="#c9a55a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="133" cy="66" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <!-- tiny sparkle dots — celebration -->
  <circle cx="20" cy="56" r="2.5" fill="#fde68a" opacity="0.8"/>
  <circle cx="14" cy="64" r="1.8" fill="#fde68a" opacity="0.6"/>
  <circle cx="140" cy="56" r="2.5" fill="#fde68a" opacity="0.8"/>
  <circle cx="146" cy="64" r="1.8" fill="#fde68a" opacity="0.6"/>
  <!-- woolly bumps -->
  <circle cx="63" cy="57" r="13" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="80" cy="50" r="15" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="97" cy="57" r="12" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <!-- face -->
  <circle cx="80" cy="78" r="30" fill="url(#fg-ah)" stroke="#d97706" stroke-width="2"/>
  <!-- joyful eyes -->
  <circle cx="70" cy="73" r="5" fill="#2d1a0e"/>
  <circle cx="72" cy="71.4" r="1.5" fill="#fff" opacity="0.78"/>
  <circle cx="90" cy="73" r="5" fill="#2d1a0e"/>
  <circle cx="92" cy="71.4" r="1.5" fill="#fff" opacity="0.78"/>
  <!-- big celebratory smile -->
  <path d="M65,87 Q80,100 95,87" fill="none" stroke="#92400e" stroke-width="2.8" stroke-linecap="round"/>
  <ellipse cx="63" cy="83" rx="7" ry="4" fill="#f87171" opacity="0.26"/>
  <ellipse cx="97" cy="83" rx="7" ry="4" fill="#f87171" opacity="0.26"/>
</svg>
