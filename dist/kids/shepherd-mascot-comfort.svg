<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-labelledby="sm-co-t">
  <title id="sm-co-t">Little Shepherd is still with you</title>
  <defs>
    <radialGradient id="fg-co" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
  </defs>
  <!-- robe -->
  <path d="M50,105 C46,124 41,157 39,192 L121,192 C119,157 114,124 110,105 Z" fill="#fef9eb" stroke="#c9a55a" stroke-width="2" stroke-linejoin="round"/>
  <line x1="69" y1="108" x2="63" y2="148" stroke="#c9a55a" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <line x1="91" y1="108" x2="97" y2="148" stroke="#c9a55a" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <!-- both arms extended forward/outward — open, comforting -->
  <path d="M52,112 Q36,118 22,118" fill="none" stroke="#c9a55a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="20" cy="118" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <path d="M108,112 Q124,118 138,118" fill="none" stroke="#c9a55a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="140" cy="118" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <!-- woolly bumps -->
  <circle cx="63" cy="57" r="13" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="80" cy="50" r="15" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="97" cy="57" r="12" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <!-- face (warm, steady) -->
  <circle cx="80" cy="78" r="30" fill="url(#fg-co)" stroke="#d97706" stroke-width="2"/>
  <!-- kind steady eyes -->
  <circle cx="70" cy="74" r="4.5" fill="#2d1a0e"/>
  <circle cx="71.6" cy="72.5" r="1.3" fill="#fff" opacity="0.72"/>
  <circle cx="90" cy="74" r="4.5" fill="#2d1a0e"/>
  <circle cx="91.6" cy="72.5" r="1.3" fill="#fff" opacity="0.72"/>
  <!-- gentle warm smile -->
  <path d="M70,87 Q80,95 90,87" fill="none" stroke="#92400e" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="63" cy="83" rx="5" ry="3" fill="#f87171" opacity="0.2"/>
  <ellipse cx="97" cy="83" rx="5" ry="3" fill="#f87171" opacity="0.2"/>
</svg>
