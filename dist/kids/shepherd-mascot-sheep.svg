<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-labelledby="sm-sh-t">
  <title id="sm-sh-t">Little Shepherd holds a small lamb gently</title>
  <defs>
    <radialGradient id="fg-sh" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
  </defs>
  <!-- robe -->
  <path d="M50,105 C46,124 41,157 39,192 L121,192 C119,157 114,124 110,105 Z" fill="#fef9eb" stroke="#c9a55a" stroke-width="2" stroke-linejoin="round"/>
  <line x1="69" y1="108" x2="63" y2="148" stroke="#c9a55a" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <line x1="91" y1="108" x2="97" y2="148" stroke="#c9a55a" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <!-- right arm (down, resting) -->
  <path d="M108,112 Q119,133 123,153" fill="none" stroke="#c9a55a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="124" cy="155" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <!-- left arm (cradling lamb) -->
  <path d="M52,112 Q36,128 28,148" fill="none" stroke="#c9a55a" stroke-width="8" stroke-linecap="round"/>
  <!-- small lamb body (cradled) -->
  <ellipse cx="26" cy="158" rx="16" ry="11" fill="#f5f0e8" stroke="#b8a99a" stroke-width="1.6"/>
  <!-- lamb head -->
  <circle cx="15" cy="150" r="10" fill="#f5f0e8" stroke="#b8a99a" stroke-width="1.6"/>
  <!-- lamb ear -->
  <path d="M10,144 Q7,138 12,136" fill="none" stroke="#b8a99a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- lamb eye -->
  <circle cx="12" cy="150" r="1.8" fill="#2d1a0e"/>
  <circle cx="12.8" cy="149.2" r="0.6" fill="#fff" opacity="0.6"/>
  <!-- lamb legs -->
  <line x1="19" y1="168" x2="17" y2="178" stroke="#b8a99a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="27" y1="169" x2="26" y2="179" stroke="#b8a99a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="35" y1="168" x2="36" y2="178" stroke="#b8a99a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- woolly bumps -->
  <circle cx="63" cy="57" r="13" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="80" cy="50" r="15" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="97" cy="57" r="12" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <!-- face -->
  <circle cx="80" cy="78" r="30" fill="url(#fg-sh)" stroke="#d97706" stroke-width="2"/>
  <!-- eyes (looking down-left at the lamb, warmly) -->
  <circle cx="69" cy="75" r="4.5" fill="#2d1a0e"/>
  <circle cx="70.6" cy="73.5" r="1.3" fill="#fff" opacity="0.72"/>
  <circle cx="89" cy="75" r="4.5" fill="#2d1a0e"/>
  <circle cx="90.6" cy="73.5" r="1.3" fill="#fff" opacity="0.72"/>
  <!-- warm smile -->
  <path d="M70,87 Q80,96 90,87" fill="none" stroke="#92400e" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="63" cy="83" rx="5" ry="3" fill="#f87171" opacity="0.17"/>
  <ellipse cx="97" cy="83" rx="5" ry="3" fill="#f87171" opacity="0.17"/>
</svg>
