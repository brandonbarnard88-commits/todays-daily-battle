  <style>
    .v-page { min-height: 100vh; min-height: 100dvh; padding: 1.5rem 1.25rem 2.5rem; max-width: 36rem; margin: 0 auto; }
    .v-page h1 { font-size: 1.05rem; font-weight: 600; color: var(--muted, #94a3b8); margin: 0 0 0.75rem; }

    }
  </style>
</head>
<body class="dark-mode">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <main class="v-page" id="main-content">
    <h1>KJV verse</h1>
    <p id="v-status" class="v-status" role="status" aria-live="polite"></p>
    <p id="v-ref" class="v-ref" hidden></p>
    <p id="v-text" class="v-text" hidden></p>
    <div id="v-offline" class="v-offline" hidden></div>
    <nav class="v-actions" aria-label="Next steps">
      <a class="v-primary" href="/bible-tool.html">Bible Tool</a>
      <a href="/reader.html">Chapter reader</a>
      <a href="/">Home</a>
    </nav>
  </main>
  <script nonce="tdb2025s">
  (function () {
    'use strict';
    var API_BASE = 'https://bible-api.com';
    var CACHE_KEY = 'tdb_v_reader_cache_v1';

    function trackEvent(name, params) {
      if (typeof window.trackEvent === 'function') window.trackEvent(name, params || {});
    }

    function getSlug() {
      try {
        var p = new URLSearchParams(window.location.search);
        return (p.get('ref') || '').trim().toLowerCase();
      } catch (e) {
        return '';
      }
    }

    function loadCache(slug) {
      try {
        var raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        var o = JSON.parse(raw);
        if (o && o.slug === slug && o.text) return o;
      } catch (e) {}
      return null;
    }

    function saveCache(slug, apiRef, text) {
      try {
        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify({ slug: slug, apiRef: apiRef, text: text, ts: Date.now() })
        );
      } catch (e) {}
    }

    var statusEl = document.getElementById('v-status');
    var refEl = document.getElementById('v-ref');
    var textEl = document.getElementById('v-text');
    var offEl = document.getElementById('v-offline');

    function setStatus(t) {
      if (statusEl) statusEl.textContent = t || '';
    }

    function showVerse(apiRef, text) {
      if (refEl) {
        refEl.textContent = apiRef + ' (KJV)';
        refEl.hidden = false;
      }
      if (textEl) {
        textEl.textContent = text;
        textEl.hidden = false;
      }
      setStatus('');
      trackEvent('verse_link_viewed', { ref_len: String(apiRef).length });
    }

    var slug = getSlug();
    if (!slug) {
      setStatus('Add a reference to the link, or open a verse card QR.');
      return;
    }

    var apiRef = window.TDB_VERSE_SLUG && window.TDB_VERSE_SLUG.decode(slug);
    if (!apiRef) {
      setStatus('That link is not quite right. Try the Bible Tool and pick your passage.');
      trackEvent('verse_link_invalid', {});
      return;
    }

    var cached = loadCache(slug);
    if (cached && cached.text) {
      showVerse(cached.apiRef || apiRef, cached.text);
      setStatus('Checking for latest text…');
    } else {
      setStatus('Loading verse…');
    }

    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var id = controller ? setTimeout(function () { controller.abort(); }, 12000) : null;
    var opts = controller ? { signal: controller.signal } : {};

    fetch(API_BASE + '/' + encodeURIComponent(apiRef) + '?translation=kjv', opts)
      .then(function (res) {
        return res.ok ? res.json() : Promise.reject(new Error('status'));
      })
      .then(function (data) {
        if (id) clearTimeout(id);
        var refOut = data.reference || apiRef;
        var body = (data.text || '').trim();
        if (!body) throw new Error('empty');
        saveCache(slug, refOut, body);
        showVerse(refOut, body);
        if (offEl) offEl.hidden = true;
      })
      .catch(function () {
        if (id) clearTimeout(id);
        if (cached && cached.text) {
          if (offEl) {
            offEl.textContent =
              'Offline — still got you. Showing the last text we saved on this device for this link.';
            offEl.hidden = false;
          }
          setStatus('');
          return;
        }
        setStatus('Could not load the verse. Check signal, or open the Bible Tool.');
        if (refEl) {
          refEl.textContent = apiRef + ' (KJV)';
          refEl.hidden = false;
        }
        if (offEl) {
          offEl.textContent =
            'If you opened this link before on this phone, try again when you have a moment of signal — we cache what we can.';
          offEl.hidden = false;
        }
        trackEvent('verse_link_fetch_failed', {});
      });
  })();
  </script>
</body>
</html>
