<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#10182a"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="rgba(212,196,168,0.9)"/>
      <stop offset="100%" stop-color="rgba(163,139,110,0.7)"/>
    </linearGradient>
  </defs>

  <rect width="720" height="480" fill="url(#bg)"/>

  <!-- Subtle background text lines (like journal pages) -->
  <line x1="80" y1="120" x2="640" y2="120" stroke="rgba(163,139,110,0.05)" stroke-width="1"/>
  <line x1="80" y1="148" x2="640" y2="148" stroke="rgba(163,139,110,0.05)" stroke-width="1"/>
  <line x1="80" y1="176" x2="640" y2="176" stroke="rgba(163,139,110,0.05)" stroke-width="1"/>
  <line x1="80" y1="204" x2="640" y2="204" stroke="rgba(163,139,110,0.05)" stroke-width="1"/>

  <!-- Large shield (center, prominent) -->
  <path d="M360 52 L480 98 L480 242 Q480 330 360 380 Q240 330 240 242 L240 98 Z"
        fill="none" stroke="rgba(212,196,168,0.75)" stroke-width="3" stroke-linejoin="round"/>
  <!-- Inner shield border -->
  <path d="M360 78 L458 118 L458 240 Q458 316 360 358 Q262 316 262 240 L262 118 Z"
        fill="none" stroke="rgba(163,139,110,0.4)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Cross on shield -->
  <line x1="360" y1="118" x2="360" y2="348" stroke="url(#shimmer)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="272" y1="220" x2="448" y2="220" stroke="url(#shimmer)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Sword (right, leaning) -->
  <line x1="545" y1="60" x2="545" y2="370" stroke="rgba(212,196,168,0.7)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Guard -->
  <line x1="516" y1="155" x2="574" y2="155" stroke="rgba(212,196,168,0.7)" stroke-width="4" stroke-linecap="round"/>
  <!-- Pommel -->
  <ellipse cx="545" cy="380" rx="11" ry="11" fill="none" stroke="rgba(212,196,168,0.7)" stroke-width="2.5"/>
  <!-- Blade tip -->
  <path d="M539 60 L545 40 L551 60" fill="none" stroke="rgba(212,196,168,0.7)" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Fuller groove on blade -->
  <line x1="545" y1="70" x2="545" y2="148" stroke="rgba(212,196,168,0.25)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Topic lines to the left (like a plan index) -->
  <text x="195" y="158" font-family="Georgia,serif" font-size="12" fill="rgba(212,196,168,0.55)" text-anchor="end">Fear ’</text>
  <text x="195" y="192" font-family="Georgia,serif" font-size="12" fill="rgba(212,196,168,0.5)" text-anchor="end">Grief ’</text>
  <text x="195" y="226" font-family="Georgia,serif" font-size="12" fill="rgba(212,196,168,0.45)" text-anchor="end">Anxiety ’</text>
  <text x="195" y="260" font-family="Georgia,serif" font-size="12" fill="rgba(212,196,168,0.38)" text-anchor="end">Anger ’</text>
  <text x="195" y="294" font-family="Georgia,serif" font-size="12" fill="rgba(212,196,168,0.3)" text-anchor="end">Loneliness ’</text>

  <!-- Corresponding answers to the right -->
  <text x="525" y="158" font-family="Georgia,serif" font-size="12" fill="rgba(212,196,168,0.55)">Faith</text>
  <text x="525" y="192" font-family="Georgia,serif" font-size="12" fill="rgba(212,196,168,0.5)">Hope</text>
  <text x="525" y="226" font-family="Georgia,serif" font-size="12" fill="rgba(212,196,168,0.45)">Peace</text>
  <text x="525" y="260" font-family="Georgia,serif" font-size="12" fill="rgba(212,196,168,0.38)">Forgiveness</text>
  <text x="525" y="294" font-family="Georgia,serif" font-size="12" fill="rgba(212,196,168,0.3)">Presence</text>

  <!-- Bottom divider -->
  <line x1="120" y1="408" x2="600" y2="408" stroke="rgba(163,139,110,0.22)" stroke-width="1"/>

  <!-- Title -->
  <text x="360" y="390" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#d4c4a8" text-anchor="middle" letter-spacing="0.4">Battle Plans</text>
  <text x="360" y="430" font-family="Georgia,serif" font-size="12" fill="rgba(163,139,110,0.8)" text-anchor="middle">76 KJV scripture paths for real battles</text>
  <text x="360" y="458" font-family="Georgia,serif" font-size="8.5" fill="rgba(163,139,110,0.35)" text-anchor="middle" letter-spacing="0.1em">TODAYSDAILYBATTLE.COM · FREE · KJV ONLY</text>
</svg>
