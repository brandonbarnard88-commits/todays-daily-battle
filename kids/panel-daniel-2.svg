  <path d="M92 92 Q100 96 108 92" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M82 88 L82 115 L118 115 L118 88 Q100 78 82 88" fill="url(#d2-robe)" stroke="#333" stroke-width="1"/>
