  <path d="M55 35 L105 35 L110 50 L98 55 L55 55 Z" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="62" y="48" font-family="Comic Sans MS, cursive" font-size="8" fill="#333">God, help me!</text>
