<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="David wins with God's help">
  <defs>
    <linearGradient id="d3-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#87CEEB"/><stop offset="1" stop-color="#E0F6FF"/></linearGradient>
    <linearGradient id="d3-tunic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A90D9"/><stop offset="1" stop-color="#2E5A8A"/></linearGradient>
  </defs>
  <rect width="200" height="160" fill="url(#d3-sky)"/>
  <rect x="0" y="100" width="200" height="60" fill="#8B7355"/>
  <!-- David - victory pose, arms up -->
  <ellipse cx="100" cy="85" rx="25" ry="28" fill="#F5DEB3" stroke="#333" stroke-width="2"/>
  <circle cx="95" cy="78" r="3" fill="#333"/>
  <circle cx="105" cy="78" r="3" fill="#333"/>
  <path d="M92 92 Q100 96 108 92" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M70 75 L70 110 L85 110 L85 75 Q77 68 70 75" fill="url(#d3-tunic)" stroke="#333" stroke-width="2"/>
  <path d="M115 75 L115 110 L130 110 L130 75 Q122 68 115 75" fill="url(#d3-tunic)" stroke="#333" stroke-width="2"/>
  <ellipse cx="100" cy="125" rx="22" ry="8" fill="#8B4513" stroke="#333" stroke-width="1"/>
  <!-- Sun rays / celebration -->
  <path d="M100 25 L102 45 M100 25 L85 35 M100 25 L115 35 M100 25 L75 50 M100 25 L125 50" stroke="#FFD93D" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- Speech bubble -->
  <path d="M70 35 L130 35 L135 52 L122 58 L70 58 Z" fill="white" stroke="#333" stroke-width="2"/>
  <text x="100" y="50" font-family="Comic Sans MS, cursive" font-size="10" fill="#333" text-anchor="middle">God helped me win!</text>
</svg>
