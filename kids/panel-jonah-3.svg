<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Jonah obeys and goes to Nineveh">
  <defs>
    <linearGradient id="j3-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#87CEEB"/><stop offset="1" stop-color="#E0F6FF"/></linearGradient>
    <linearGradient id="j3-robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A90D9"/><stop offset="1" stop-color="#2E5A8A"/></linearGradient>
  </defs>
  <rect width="200" height="160" fill="url(#j3-sky)"/>
  <rect x="0" y="100" width="200" height="60" fill="#6B8E23"/>
  <ellipse cx="50" cy="115" rx="35" ry="25" fill="#7BA05B"/>
  <ellipse cx="150" cy="110" rx="40" ry="30" fill="#8FBC8F"/>
  <!-- City / Nineveh in distance -->
  <rect x="130" y="85" width="25" height="30" fill="#8B7355" stroke="#5D4E37" stroke-width="1"/>
  <rect x="158" y="75" width="20" height="40" fill="#9B8365" stroke="#5D4E37" stroke-width="1"/>
  <rect x="145" y="90" width="18" height="25" fill="#7B6345" stroke="#5D4E37" stroke-width="1"/>
  <!-- Jonah walking toward Nineveh (obeying) -->
  <ellipse cx="85" cy="78" rx="18" ry="22" fill="#F5DEB3" stroke="#333" stroke-width="1.5"/>
  <circle cx="80" cy="73" r="2.5" fill="#333"/>
  <circle cx="90" cy="73" r="2.5" fill="#333"/>
  <path d="M78 86 Q85 89 92 86" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M67 83 L67 113 L82 113 L82 83 Q74 73 67 83" fill="url(#j3-robe)" stroke="#333" stroke-width="1"/>
  <path d="M88 83 L88 113 L103 113 L103 83 Q96 73 88 83" fill="url(#j3-robe)" stroke="#333" stroke-width="1"/>
  <line x1="75" y1="113" x2="68" y2="128" stroke="#5D4E37" stroke-width="3"/>
  <line x1="95" y1="113" x2="102" y2="126" stroke="#5D4E37" stroke-width="3"/>
  <!-- Arm pointing toward city -->
  <line x1="103" y1="88" x2="125" y2="95" stroke="#F5DEB3" stroke-width="4" stroke-linecap="round"/>
  <!-- Speech bubble -->
  <path d="M50 40 L110 40 L115 55 L102 60 L50 60 Z" fill="white" stroke="#333" stroke-width="2"/>
  <text x="58" y="52" font-family="Comic Sans MS, cursive" font-size="9" fill="#333">I'll obey God!</text>
</svg>
