<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Noah building the ark">
  <defs>
    <linearGradient id="n1-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B4513"/><stop offset="1" stop-color="#A0522D"/></linearGradient>
  </defs>
  <rect width="200" height="160" fill="#87CEEB"/>
  <rect x="0" y="110" width="200" height="50" fill="#6B8E23"/>
  <!-- Ark in progress -->
  <rect x="40" y="95" width="120" height="45" rx="5" fill="url(#n1-wood)" stroke="#5D4E37" stroke-width="2"/>
  <rect x="55" y="80" width="90" height="20" fill="url(#n1-wood)" stroke="#5D4E37" stroke-width="1"/>
  <!-- Noah figure with hammer -->
  <ellipse cx="100" cy="75" rx="15" ry="18" fill="#F5DEB3" stroke="#333" stroke-width="1"/>
  <path d="M95 82 Q100 85 105 82" stroke="#333" stroke-width="1" fill="none"/>
  <rect x="85" y="88" width="30" height="25" fill="#4A90D9" stroke="#333" stroke-width="1"/>
  <line x1="100" y1="95" x2="100" y2="55" stroke="#5D4E37" stroke-width="3"/>
  <!-- Speech bubble -->
  <path d="M130 50 L165 50 L170 65 L158 70 L130 70 Z" fill="white" stroke="#333" stroke-width="2"/>
  <text x="135" y="62" font-family="Comic Sans MS, cursive" font-size="9" fill="#333">Building for God!</text>
</svg>
