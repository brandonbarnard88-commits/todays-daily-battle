<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-labelledby="sm-ch-t">
  <title id="sm-ch-t">Little Shepherd cheering for you</title>
  <defs>
    <radialGradient id="fg-ch" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
  </defs>
  <!-- robe -->
  <path d="M50,105 C46,124 41,157 39,192 L121,192 C119,157 114,124 110,105 Z" fill="#fef9eb" stroke="#c9a55a" stroke-width="2" stroke-linejoin="round"/>
  <line x1="69" y1="108" x2="63" y2="148" stroke="#c9a55a" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <line x1="91" y1="108" x2="97" y2="148" stroke="#c9a55a" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <!-- both arms slightly raised in cheer -->
  <path d="M52,112 Q38,100 30,86" fill="none" stroke="#c9a55a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="29" cy="84" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <path d="M108,112 Q122,100 130,86" fill="none" stroke="#c9a55a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="131" cy="84" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <!-- woolly bumps -->
  <circle cx="63" cy="57" r="13" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="80" cy="50" r="15" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="97" cy="57" r="12" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <!-- face -->
  <circle cx="80" cy="78" r="30" fill="url(#fg-ch)" stroke="#d97706" stroke-width="2"/>
  <!-- eyes (bright with delight) -->
  <circle cx="70" cy="73" r="4.8" fill="#2d1a0e"/>
  <circle cx="71.8" cy="71.5" r="1.4" fill="#fff" opacity="0.78"/>
  <circle cx="90" cy="73" r="4.8" fill="#2d1a0e"/>
  <circle cx="91.8" cy="71.5" r="1.4" fill="#fff" opacity="0.78"/>
  <!-- big warm smile -->
  <path d="M68,87 Q80,98 92,87" fill="none" stroke="#92400e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- cheeks extra rosy -->
  <ellipse cx="63" cy="83" rx="6" ry="3.5" fill="#f87171" opacity="0.22"/>
  <ellipse cx="97" cy="83" rx="6" ry="3.5" fill="#f87171" opacity="0.22"/>
</svg>
