<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-labelledby="sm-re-t">
  <title id="sm-re-t">Little Shepherd holds Scripture open</title>
  <defs>
    <radialGradient id="fg-re" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
  </defs>
  <!-- robe -->
  <path d="M50,105 C46,124 41,157 39,192 L121,192 C119,157 114,124 110,105 Z" fill="#fef9eb" stroke="#c9a55a" stroke-width="2" stroke-linejoin="round"/>
  <line x1="69" y1="108" x2="63" y2="148" stroke="#c9a55a" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <line x1="91" y1="108" x2="97" y2="148" stroke="#c9a55a" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <!-- open scroll / book held in both hands -->
  <rect x="30" y="126" width="100" height="50" rx="7" fill="#fef9eb" stroke="#c9a55a" stroke-width="2"/>
  <!-- scroll rolled edges -->
  <path d="M30,126 Q30,114 37,114 Q44,114 44,126" fill="#fef9eb" stroke="#c9a55a" stroke-width="1.8"/>
  <path d="M130,126 Q130,114 123,114 Q116,114 116,126" fill="#fef9eb" stroke="#c9a55a" stroke-width="1.8"/>
  <!-- text lines on scroll -->
  <line x1="44" y1="138" x2="116" y2="138" stroke="#c9a55a" stroke-width="1.2" opacity="0.5"/>
  <line x1="44" y1="148" x2="116" y2="148" stroke="#c9a55a" stroke-width="1.2" opacity="0.5"/>
  <line x1="44" y1="158" x2="96" y2="158" stroke="#c9a55a" stroke-width="1.2" opacity="0.5"/>
  <!-- left arm (holding left side of scroll) -->
  <path d="M52,112 Q42,120 35,132" fill="none" stroke="#c9a55a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="33" cy="134" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <!-- right arm (holding right side) -->
  <path d="M108,112 Q118,120 125,132" fill="none" stroke="#c9a55a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="127" cy="134" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <!-- woolly bumps -->
  <circle cx="63" cy="57" r="13" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="80" cy="50" r="15" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="97" cy="57" r="12" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <!-- face -->
  <circle cx="80" cy="78" r="30" fill="url(#fg-re)" stroke="#d97706" stroke-width="2"/>
  <!-- eyes (looking downward at the scroll) -->
  <circle cx="70" cy="75" r="4.5" fill="#2d1a0e"/>
  <circle cx="71.6" cy="73.5" r="1.3" fill="#fff" opacity="0.72"/>
  <circle cx="90" cy="75" r="4.5" fill="#2d1a0e"/>
  <circle cx="91.6" cy="73.5" r="1.3" fill="#fff" opacity="0.72"/>
  <!-- peaceful smile -->
  <path d="M71,87 Q80,94 89,87" fill="none" stroke="#92400e" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="63" cy="83" rx="5" ry="3" fill="#f87171" opacity="0.17"/>
  <ellipse cx="97" cy="83" rx="5" ry="3" fill="#f87171" opacity="0.17"/>
</svg>
