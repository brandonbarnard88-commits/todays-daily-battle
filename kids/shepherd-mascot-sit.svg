<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-labelledby="sm-si-t">
  <title id="sm-si-t">Little Shepherd sitting quietly with a small lamb</title>
  <defs>
    <radialGradient id="fg-si" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
  </defs>
  <!-- seated robe (lap spread out horizontally) -->
  <path d="M28,142 Q40,136 80,138 Q120,136 132,142 L128,185 Q80,192 32,185 Z" fill="#fef9eb" stroke="#c9a55a" stroke-width="2" stroke-linejoin="round"/>
  <!-- robe upper body -->
  <path d="M52,102 C49,118 46,132 44,142 L116,142 C114,132 111,118 108,102 Z" fill="#fef9eb" stroke="#c9a55a" stroke-width="2" stroke-linejoin="round"/>
  <line x1="68" y1="105" x2="62" y2="132" stroke="#c9a55a" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <line x1="92" y1="105" x2="98" y2="132" stroke="#c9a55a" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <!-- left arm (resting on lap, holding lamb) -->
  <path d="M52,112 Q40,128 35,148" fill="none" stroke="#c9a55a" stroke-width="8" stroke-linecap="round"/>
  <!-- lamb in lap -->
  <ellipse cx="68" cy="170" rx="18" ry="11" fill="#f5f0e8" stroke="#b8a99a" stroke-width="1.6"/>
  <circle cx="55" cy="163" r="10" fill="#f5f0e8" stroke="#b8a99a" stroke-width="1.6"/>
  <circle cx="50" cy="157" r="1.8" fill="#2d1a0e"/>
  <circle cx="50.8" cy="156.2" r="0.6" fill="#fff" opacity="0.6"/>
  <path d="M48,156 Q45,150 50,149" fill="none" stroke="#b8a99a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- right arm (resting side) -->
  <path d="M108,112 Q120,128 125,148" fill="none" stroke="#c9a55a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="126" cy="150" r="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <!-- woolly bumps -->
  <circle cx="63" cy="54" r="13" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="80" cy="47" r="15" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="97" cy="54" r="12" fill="#fef9eb" stroke="#d97706" stroke-width="1.8"/>
  <!-- face -->
  <circle cx="80" cy="75" r="30" fill="url(#fg-si)" stroke="#d97706" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="70" cy="71" r="4.5" fill="#2d1a0e"/>
  <circle cx="71.6" cy="69.5" r="1.3" fill="#fff" opacity="0.72"/>
  <circle cx="90" cy="71" r="4.5" fill="#2d1a0e"/>
  <circle cx="91.6" cy="69.5" r="1.3" fill="#fff" opacity="0.72"/>
  <!-- gentle smile -->
  <path d="M70,84 Q80,93 90,84" fill="none" stroke="#92400e" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="63" cy="80" rx="5" ry="3" fill="#f87171" opacity="0.17"/>
  <ellipse cx="97" cy="80" rx="5" ry="3" fill="#f87171" opacity="0.17"/>
</svg>
