<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" fill="none" role="img" aria-label="Today's Daily Battle — Less scroll, more Soul">
  <defs>
    <!-- Gold gradients -->
    <linearGradient id="gold-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe680"/>
      <stop offset="35%"  stop-color="#ffc200"/>
      <stop offset="65%"  stop-color="#e08800"/>
      <stop offset="100%" stop-color="#ffda6a"/>
    </linearGradient>
    <linearGradient id="gold-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff5c0"/>
      <stop offset="50%"  stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="shield-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1626"/>
      <stop offset="55%"  stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#060b14"/>
    </linearGradient>
    <linearGradient id="rays-fade" cx="50%" cy="0%" r="100%" gradientUnits="userSpaceOnUse" id="rays-fade" x1="160" y1="80" x2="160" y2="220">
      <stop offset="0%"   stop-color="#ffdf6a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%"   stop-color="#ffd04a" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#ff9800" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dove-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cross-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff8dc"/>
      <stop offset="50%"  stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tablet-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d4c47a"/>
      <stop offset="100%" stop-color="#9a8640"/>
    </linearGradient>
    <linearGradient id="candle-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="30%"  stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rays-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="halo-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="dove-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#b06000" flood-opacity="0.7"/>
    </filter>
    <filter id="banner-shadow" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <clipPath id="shield-clip">
      <!-- Shield shape for content clipping -->
      <path d="M 58,52 L 262,52 L 262,240 Q 262,320 160,368 Q 58,320 58,240 Z"/>
    </clipPath>

    <style>
      @media (prefers-reduced-motion: no-preference) {
        /* Rays rotate slowly */
        .rays-group {
          transform-origin: 160px 138px;
          animation: rays-spin 40s linear infinite;
        }
        @keyframes rays-spin {
          from { transform: rotate(0deg); }
          to   { transform: rotate(360deg); }
        }

        /* Halo pulses */
        .halo-pulse {
          animation: halo-breathe 4s ease-in-out infinite;
        }
        @keyframes halo-breathe {
          0%, 100% { opacity: 0.6; }
          50%       { opacity: 1.0; }
        }

        /* Dove floats gently */
        .dove-group {
          transform-origin: 160px 112px;
          animation: dove-float 5s ease-in-out infinite;
        }
        @keyframes dove-float {
          0%, 100% { transform: translateY(0px); }
          50%       { transform: translateY(-4px); }
        }

        /* Cross draws on */
        .cross-v {
          stroke-dasharray: 1000;
          stroke-dashoffset: 1000;
          animation: draw-cross 1.4s cubic-bezier(0.25,0.1,0.25,1) 0.3s forwards;
        }
        .cross-h {
          stroke-dasharray: 1000;
          stroke-dashoffset: 1000;
          animation: draw-cross 0.9s cubic-bezier(0.25,0.1,0.25,1) 1.2s forwards;
        }
        @keyframes draw-cross { to { stroke-dashoffset: 0; } }

        /* Logo text fades in last */
        .logo-text {
          opacity: 0;
          animation: text-in 1s ease-out 2.2s forwards;
        }
        @keyframes text-in {
          from { opacity: 0; transform: translateY(5px); }
          to   { opacity: 1; transform: translateY(0); }
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cross-v, .cross-h { stroke-dashoffset: 0 !important; }
        .logo-text { opacity: 1 !important; transform: none !important; }
      }
    </style>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="320" height="400" fill="#080d18"/>

  <!-- ═══ AMBIENT HALO ═══ -->
  <ellipse class="halo-pulse" cx="160" cy="138" rx="130" ry="110" fill="url(#halo-glow)" filter="url(#halo-blur)"/>

  <!-- ═══ LIGHT RAYS ═══ -->
  <g class="rays-group" opacity="0.55" filter="url(#rays-blur)">
    <line x1="160" y1="138" x2="160" y2="10"  stroke="url(#rays-fade)" stroke-width="6"/>
    <line x1="160" y1="138" x2="80"  y2="30"  stroke="url(#rays-fade)" stroke-width="4"/>
    <line x1="160" y1="138" x2="240" y2="30"  stroke="url(#rays-fade)" stroke-width="4"/>
    <line x1="160" y1="138" x2="30"  y2="90"  stroke="url(#rays-fade)" stroke-width="3"/>
    <line x1="160" y1="138" x2="290" y2="90"  stroke="url(#rays-fade)" stroke-width="3"/>
    <line x1="160" y1="138" x2="14"  y2="155" stroke="url(#rays-fade)" stroke-width="2.5"/>
    <line x1="160" y1="138" x2="306" y2="155" stroke="url(#rays-fade)" stroke-width="2.5"/>
    <line x1="160" y1="138" x2="100" y2="14"  stroke="url(#rays-fade)" stroke-width="3"/>
    <line x1="160" y1="138" x2="220" y2="14"  stroke="url(#rays-fade)" stroke-width="3"/>
    <line x1="160" y1="138" x2="50"  y2="55"  stroke="url(#rays-fade)" stroke-width="2.5"/>
    <line x1="160" y1="138" x2="270" y2="55"  stroke="url(#rays-fade)" stroke-width="2.5"/>
    <line x1="160" y1="138" x2="22"  y2="120" stroke="url(#rays-fade)" stroke-width="2"/>
    <line x1="160" y1="138" x2="298" y2="120" stroke="url(#rays-fade)" stroke-width="2"/>
  </g>

  <!-- ═══ SHIELD BODY ═══ -->
  <!-- Shield outer border (gold) -->
  <path d="M 55,48 L 265,48 L 265,242 Q 265,328 160,375 Q 55,328 55,242 Z"
        fill="url(#gold-main)" filter="url(#gold-glow)"/>
  <!-- Shield inner body (dark blue) -->
  <path d="M 63,56 L 257,56 L 257,240 Q 257,318 160,362 Q 63,318 63,240 Z"
        fill="url(#shield-bg)"/>
  <!-- Shield inner gold accent line -->
  <path d="M 70,63 L 250,63 L 250,238 Q 250,312 160,354 Q 70,312 70,238 Z"
        fill="none" stroke="url(#gold-light)" stroke-width="1.5" opacity="0.45"/>

  <!-- ═══ CROWN ═══ -->
  <g filter="url(#gold-glow)">
    <!-- Crown base bar -->
    <rect x="108" y="64" width="104" height="11" rx="3" fill="url(#gold-main)"/>
    <!-- Crown points: 5 points -->
    <!-- Center tallest point -->
    <path d="M 157,64 L 157,42 L 163,42 L 163,64 Z" fill="url(#gold-main)"/>
    <!-- Center-left -->
    <path d="M 143,64 L 140,50 L 146,50 L 149,64 Z" fill="url(#gold-main)"/>
    <!-- Center-right -->
    <path d="M 171,64 L 174,50 L 180,50 L 177,64 Z" fill="url(#gold-main)"/>
    <!-- Far-left -->
    <path d="M 111,64 L 108,55 L 114,53 L 117,64 Z" fill="url(#gold-main)"/>
    <!-- Far-right -->
    <path d="M 209,64 L 212,55 L 206,53 L 203,64 Z" fill="url(#gold-main)"/>
    <!-- Crown jewel dots -->
    <circle cx="160" cy="41" r="3.5" fill="#fff5c0" opacity="0.9"/>
    <circle cx="143" cy="49" r="2.5" fill="#ffd54f" opacity="0.8"/>
    <circle cx="177" cy="49" r="2.5" fill="#ffd54f" opacity="0.8"/>
    <circle cx="111" cy="53" r="2" fill="#ffcc44" opacity="0.7"/>
    <circle cx="209" cy="53" r="2" fill="#ffcc44" opacity="0.7"/>
    <!-- Laurel left -->
    <path d="M 68,75 Q 80,60 96,68 Q 82,78 68,75 Z" fill="url(#gold-main)" opacity="0.8"/>
    <path d="M 68,75 Q 78,88 95,82 Q 82,72 68,75 Z" fill="url(#gold-light)" opacity="0.6"/>
    <!-- Laurel right -->
    <path d="M 252,75 Q 240,60 224,68 Q 238,78 252,75 Z" fill="url(#gold-main)" opacity="0.8"/>
    <path d="M 252,75 Q 242,88 225,82 Q 238,72 252,75 Z" fill="url(#gold-light)" opacity="0.6"/>
  </g>

  <!-- ═══ CANDLES ═══ -->
  <g opacity="0.85">
    <!-- Left candle -->
    <rect x="133" y="92" width="8" height="28" rx="2" fill="url(#gold-light)"/>
    <ellipse cx="137" cy="87" rx="4.5" ry="7" fill="url(#candle-flame)" opacity="0.9"/>
    <!-- Center candle (tallest) -->
    <rect x="156" y="85" width="9" height="35" rx="2" fill="url(#gold-main)"/>
    <ellipse cx="160.5" cy="79" rx="5" ry="8" fill="url(#candle-flame)"/>
    <!-- Right candle -->
    <rect x="179" y="92" width="8" height="28" rx="2" fill="url(#gold-light)"/>
    <ellipse cx="183" cy="87" rx="4.5" ry="7" fill="url(#candle-flame)" opacity="0.9"/>
    <!-- Candle platform -->
    <rect x="126" y="118" width="68" height="6" rx="2" fill="url(#gold-main)"/>
    <rect x="122" y="123" width="76" height="4" rx="2" fill="url(#gold-light)" opacity="0.7"/>
  </g>

  <!-- ═══ DOVE ═══ -->
  <g class="dove-group" filter="url(#dove-filter)">
    <!-- Glow behind dove -->
    <ellipse cx="160" cy="112" rx="22" ry="14" fill="url(#dove-glow)" filter="url(#halo-blur)" opacity="0.5"/>
    <!-- Dove body -->
    <ellipse cx="160" cy="113" rx="11" ry="6" fill="#ffffff" opacity="0.95"/>
    <!-- Dove head -->
    <circle cx="170" cy="110" r="5" fill="#ffffff" opacity="0.95"/>
    <!-- Dove beak -->
    <path d="M 175,110 L 179,109 L 175,112 Z" fill="url(#gold-light)"/>
    <!-- Left wing (spread) -->
    <path d="M 160,112 Q 138,98 128,108 Q 138,116 149,114 Q 154,113 160,112 Z" fill="#f0f0ff" opacity="0.92"/>
    <!-- Right wing (spread) -->
    <path d="M 160,112 Q 182,98 192,108 Q 182,116 171,114 Q 166,113 160,112 Z" fill="#f0f0ff" opacity="0.92"/>
    <!-- Wing feather detail left -->
    <path d="M 140,106 Q 145,112 152,113" fill="none" stroke="#d0d0e8" stroke-width="1" opacity="0.5"/>
    <path d="M 133,109 Q 140,113 148,113" fill="none" stroke="#d0d0e8" stroke-width="0.8" opacity="0.4"/>
    <!-- Wing feather detail right -->
    <path d="M 180,106 Q 175,112 168,113" fill="none" stroke="#d0d0e8" stroke-width="1" opacity="0.5"/>
    <path d="M 187,109 Q 180,113 172,113" fill="none" stroke="#d0d0e8" stroke-width="0.8" opacity="0.4"/>
    <!-- Tail -->
    <path d="M 149,115 Q 148,122 152,124 Q 150,117 155,116 Z" fill="#f0f0ff" opacity="0.8"/>
  </g>

  <!-- ═══ COMMANDMENT TABLETS ═══ -->
  <!-- Left tablet -->
  <g filter="url(#gold-glow)" opacity="0.88">
    <rect x="78" y="228" width="52" height="62" rx="5" fill="url(#tablet-bg)"/>
    <rect x="78" y="228" width="52" height="62" rx="5" fill="none" stroke="url(#gold-main)" stroke-width="2"/>
    <!-- Rounded top arch -->
    <rect x="78" y="228" width="52" height="20" rx="5" fill="url(#gold-light)" opacity="0.4"/>
    <!-- Roman numerals I–V -->
    <text x="104" y="248" text-anchor="middle" font-family="serif" font-size="8" fill="#1a1200" font-weight="bold" opacity="0.9">I · II · III</text>
    <text x="104" y="260" text-anchor="middle" font-family="serif" font-size="8" fill="#1a1200" opacity="0.9">IV · V</text>
    <line x1="84" y1="264" x2="124" y2="264" stroke="#5a4800" stroke-width="0.8" opacity="0.5"/>
    <text x="104" y="275" text-anchor="middle" font-family="serif" font-size="7" fill="#2a1e00" opacity="0.8">VI · VII</text>
    <text x="104" y="284" text-anchor="middle" font-family="serif" font-size="7" fill="#2a1e00" opacity="0.8">VIII · IX · X</text>
  </g>
  <!-- Right tablet -->
  <g filter="url(#gold-glow)" opacity="0.88">
    <rect x="190" y="228" width="52" height="62" rx="5" fill="url(#tablet-bg)"/>
    <rect x="190" y="228" width="52" height="62" rx="5" fill="none" stroke="url(#gold-main)" stroke-width="2"/>
    <rect x="190" y="228" width="52" height="20" rx="5" fill="url(#gold-light)" opacity="0.4"/>
    <text x="216" y="248" text-anchor="middle" font-family="serif" font-size="8" fill="#1a1200" font-weight="bold" opacity="0.9">VI · VII · VIII</text>
    <text x="216" y="260" text-anchor="middle" font-family="serif" font-size="8" fill="#1a1200" opacity="0.9">IX · X</text>
    <line x1="196" y1="264" x2="236" y2="264" stroke="#5a4800" stroke-width="0.8" opacity="0.5"/>
    <text x="216" y="275" text-anchor="middle" font-family="serif" font-size="7.5" fill="#2a1e00" opacity="0.8">Exod. 20</text>
    <text x="216" y="284" text-anchor="middle" font-family="serif" font-size="7" fill="#2a1e00" opacity="0.8">Deut. 5</text>
  </g>

  <!-- ═══ CROSS (draw-on) ═══ -->
  <!-- Cross glow -->
  <g opacity="0.5" filter="url(#halo-blur)">
    <line x1="160" y1="148" x2="160" y2="308" stroke="#ffd54f" stroke-width="18" stroke-linecap="round"/>
    <line x1="120" y1="198" x2="200" y2="198" stroke="#ffd54f" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- Cross vertical -->
  <path class="cross-v"
    d="M 160,148 C 159,175 159,195 160,200 C 161,205 161,265 160,308"
    pathLength="1000"
    stroke="url(#cross-grad)"
    stroke-width="14"
    stroke-linecap="round"
    fill="none"
    filter="url(#gold-glow)"/>
  <!-- Cross horizontal -->
  <path class="cross-h"
    d="M 120,200 C 134,197 148,196 160,196 C 172,196 186,197 200,200"
    pathLength="1000"
    stroke="url(#cross-grad)"
    stroke-width="11"
    stroke-linecap="round"
    fill="none"
    filter="url(#gold-glow)"/>

  <!-- ═══ BANNER / TAGLINE ═══ -->
  <!-- Banner ribbon -->
  <g filter="url(#banner-shadow)" opacity="0.95">
    <!-- Ribbon left tail -->
    <path d="M 68,136 L 88,128 L 88,148 L 68,152 Z" fill="#0d1a2e"/>
    <path d="M 68,136 L 88,128 L 88,148 L 68,152 Z" fill="none" stroke="url(#gold-main)" stroke-width="1.5"/>
    <!-- Ribbon right tail -->
    <path d="M 252,136 L 232,128 L 232,148 L 252,152 Z" fill="#0d1a2e"/>
    <path d="M 252,136 L 232,128 L 232,148 L 252,152 Z" fill="none" stroke="url(#gold-main)" stroke-width="1.5"/>
    <!-- Main ribbon body -->
    <rect x="88" y="125" width="144" height="26" rx="3" fill="#0d1a2e"/>
    <rect x="88" y="125" width="144" height="26" rx="3" fill="none" stroke="url(#gold-main)" stroke-width="1.5"/>
    <!-- Ribbon inner highlight line -->
    <line x1="92" y1="129" x2="228" y2="129" stroke="url(#gold-light)" stroke-width="0.8" opacity="0.4"/>
    <line x1="92" y1="147" x2="228" y2="147" stroke="url(#gold-light)" stroke-width="0.8" opacity="0.3"/>
  </g>
  <!-- Banner text -->
  <text x="160" y="142" text-anchor="middle"
    font-family="'Palatino Linotype', 'Book Antiqua', Palatino, 'IM Fell English', Georgia, serif"
    font-size="11.5" font-style="italic" font-weight="600"
    fill="url(#gold-main)"
    filter="url(#text-shadow)"
    letter-spacing="0.8">Less scroll, more Soul</text>

  <!-- ═══ SITE NAME (below shield) ═══ -->
  <text class="logo-text"
    x="160" y="390"
    text-anchor="middle"
    font-family="'Caveat', 'Amatic SC', 'Patrick Hand', cursive"
    font-size="26"
    font-weight="700"
    letter-spacing="2"
    fill="#ffffff"
    filter="url(#text-shadow)">Today's Daily Battle</text>

  <!-- Underline accent -->
  <rect x="54" y="396" width="212" height="1.5" rx="1" fill="url(#gold-main)" opacity="0.35"/>

</svg>
