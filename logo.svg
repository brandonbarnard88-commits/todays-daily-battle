<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none" role="img" aria-label="Today's Daily Battle — cross and sunrise">
  <defs>
    <radialGradient id="sg-halo" cx="50%" cy="78%" r="70%" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#ffaa44" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sg-bloom" cx="50%" cy="75%" r="56%" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#ffd97a" stop-opacity="0.58"/>
      <stop offset="40%" stop-color="#ff7828" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff5010" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sg-core" cx="50%" cy="72%" r="48%" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#ffcc55" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#ff8c2a" stop-opacity="0.75"/>
      <stop offset="58%" stop-color="#e05a10" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#c04010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff8833" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#ff8833" stop-opacity="0.28"/>
      <stop offset="50%"  stop-color="#ffcc55" stop-opacity="0.52"/>
      <stop offset="80%"  stop-color="#ff8833" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff8833" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cross-v-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#fde8bb" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f5c96a" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="cross-h-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f5c96a" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#fff8e8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f5c96a" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="blur-lg" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="blur-md" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="cross-glow" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-fx" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#c07010" flood-opacity="0.60"/>
    </filter>
    <clipPath id="clip"><rect width="240" height="280"/></clipPath>

    <style>
      @media (prefers-reduced-motion: no-preference) {

        /* ── Sunrise bloom: scale 0.8→1 + opacity 0→target ──
           transform-box + transform-origin anchor scale to each
           element's own centre so it blooms outward, not from SVG origin */
        .sr-layer {
          opacity: 0;
          transform-box: fill-box;
          transform-origin: center center;
          animation: sr-bloom 3s ease-out forwards;
        }
        /* Each layer gets a slightly different final opacity to preserve depth */
        .sr-1 { animation-delay: 1.55s; --sr-end-opacity: 0.65; }
        .sr-2 { animation-delay: 1.72s; --sr-end-opacity: 0.72; }
        .sr-3 { animation-delay: 1.88s; --sr-end-opacity: 0.80; }
        .sr-4 { animation-delay: 2.00s; --sr-end-opacity: 0.40; }
        .sr-horizon { animation-delay: 2.10s; --sr-end-opacity: 1.0; }

        @keyframes sr-bloom {
          0%   { opacity: 0;   transform: scale(0.8); }
          100% { opacity: var(--sr-end-opacity, 0.7); transform: scale(1); }
        }

        /* ── Cross draw-on ── */
        .cross-v {
          stroke-dasharray: 1000;
          stroke-dashoffset: 1000;
          animation: draw-cross 1.4s cubic-bezier(0.25, 0.1, 0.25, 1) 0.1s forwards;
        }
        .cross-h {
          stroke-dasharray: 1000;
          stroke-dashoffset: 1000;
          animation: draw-cross 0.9s cubic-bezier(0.25, 0.1, 0.25, 1) 0.85s forwards;
        }
        @keyframes draw-cross { to { stroke-dashoffset: 0; } }

        /* ── Cross glow blooms after drawing ── */
        .cross-glow-layer {
          opacity: 0;
          transform-box: fill-box;
          transform-origin: center center;
          animation: sr-bloom 1.4s ease-out 1.65s forwards;
          --sr-end-opacity: 0.55;
        }

        /* ── Text slides up last ── */
        .logo-text, .logo-underline {
          opacity: 0;
          animation: text-in 0.9s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }
        .logo-text      { animation-delay: 2.4s; }
        .logo-underline { animation-delay: 2.6s; }
        @keyframes text-in {
          from { opacity: 0; transform: translateY(6px); }
          to   { opacity: 1; transform: translateY(0); }
        }
      }

      /* Static fallback — no motion */
      @media (prefers-reduced-motion: reduce) {
        .sr-layer   { opacity: 0.7  !important; transform: none !important; }
        .sr-4       { opacity: 0.40 !important; }
        .cross-glow-layer  { opacity: 0.55 !important; transform: none !important; }
        .logo-text, .logo-underline { opacity: 1 !important; transform: none !important; }
        .cross-v, .cross-h { stroke-dashoffset: 0 !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#clip)">

    <!-- ══ SUNRISE — blooms after cross draws ══ -->
    <ellipse class="sr-layer sr-1" cx="120" cy="172" rx="132" ry="78" fill="url(#sg-halo)"  filter="url(#blur-lg)"/>
    <ellipse class="sr-layer sr-2" cx="120" cy="168" rx="105" ry="62" fill="url(#sg-bloom)" filter="url(#blur-lg)"/>
    <ellipse class="sr-layer sr-3" cx="120" cy="164" rx="80"  ry="50" fill="url(#sg-core)"  filter="url(#blur-md)"/>
    <ellipse class="sr-layer sr-4" cx="120" cy="166" rx="38"  ry="22" fill="#ffdd88" filter="url(#blur-md)"/>
    <rect class="sr-layer sr-horizon" x="0" y="168" width="240" height="1.5" fill="url(#horizon-fade)" rx="1"/>

    <!-- ══ CROSS GLOW — blooms in after draw ══ -->
    <g class="cross-glow-layer" filter="url(#blur-md)">
      <line x1="120" y1="32"  x2="120" y2="190" stroke="#ffd580" stroke-width="16" stroke-linecap="round"/>
      <line x1="64"  y1="104" x2="176" y2="104" stroke="#ffd580" stroke-width="12" stroke-linecap="round"/>
    </g>

    <!-- ══ CROSS — draw-on ══ -->
    <!-- Vertical: waisted cubic, top→bottom -->
    <path class="cross-v"
      d="M 120,32 C 119,68 119,92 120,104 C 121,116 121,148 120,190"
      pathLength="1000"
      stroke="url(#cross-v-grad)"
      stroke-width="11"
      stroke-linecap="round"
      fill="none"
      filter="url(#cross-glow)"/>

    <!-- Horizontal: gently bowed, left→right -->
    <path class="cross-h"
      d="M 64,106 C 88,103 108,102 120,102 C 132,102 152,103 176,106"
      pathLength="1000"
      stroke="url(#cross-h-grad)"
      stroke-width="9"
      stroke-linecap="round"
      fill="none"
      filter="url(#cross-glow)"/>

    <!-- ══ TEXT ══ -->
    <text class="logo-text"
      x="120" y="228"
      text-anchor="middle"
      font-family="'Caveat', 'Amatic SC', 'Patrick Hand', cursive"
      font-size="30"
      font-weight="700"
      letter-spacing="2.5"
      fill="#ffffff"
      filter="url(#text-fx)">Today's Battle</text>

    <rect class="logo-underline"
      x="36" y="235" width="168" height="1.5" rx="1"
      fill="#ffcc55" opacity="0.22"/>

  </g>
</svg>
