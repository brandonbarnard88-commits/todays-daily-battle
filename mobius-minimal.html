<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Möbius • Enoch's Vision • Today's Daily Battle</title>
  <meta name="description" content="Enoch walked with God. Then he was not. Because the loop doesn't end.">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://todaysdailybattle.com/mobius-minimal.html">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: 'Georgia', serif;
      overflow: hidden;
    }
    svg {
      width: 80vmin;
      height: 80vmin;
      animation: spin 20s linear infinite;
    }
    .text {
      margin-top: 2rem;
      font-size: 1.4rem;
      color: #222;
      letter-spacing: 0.05em;
      line-height: 1.6;
      text-align: center;
      max-width: 28ch;
      opacity: 0;
      animation: fadeIn 4s ease 1.5s forwards;
    }
    .footnote {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #666;
      font-style: italic;
      opacity: 0;
      animation: fadeIn 3s ease 5s forwards;
    }
    @media (prefers-reduced-motion: reduce) {
      .text, .footnote { animation: none; opacity: 1; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <svg viewBox="-150 -150 300 300" aria-hidden="true">
    <path d="M 0,0 Q 100,100 0,200 Q -100,100 0,0" 
          fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
    <path d="M 0,0 Q -100,-100 0,-200 Q 100,-100 0,0" 
          fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  </svg>

  <p class="text" role="status">Enoch walked with God. Then he was not. Because the loop doesn't end.</p>
  <p class="footnote">Genesis 5:24 · Enoch 1:3: "I saw the Lord… and He turned me around."</p>
</body>
</html>
