  <style>
    .mobius-hero { text-align: center; margin-bottom: 0.75rem; flex-shrink: 0; }
    .mobius-hero h1 { margin: 0; font-size: clamp(1.15rem, 4vw, 1.5rem); font-weight: 600; color: var(--tool-text, #f5f7fb); }
    .mobius-hero p { margin: 0.4rem 0 0; font-size: 0.9rem; color: var(--tool-muted, #bcc5d6); max-width: 520px; margin-left: auto; margin-right: auto; line-height: 1.5; }
    .mobius-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.5rem 1rem; margin-bottom: 1rem; }
    .mobius-controls label { font-size: 0.85rem; color: var(--tool-muted); }
    .mobius-mood-select { padding: 0.4rem 0.75rem; font-size: 0.9rem; color: var(--tool-text); background: rgba(26, 33, 45, 0.9); border: 1px solid var(--tool-line); border-radius: 8px; min-width: 140px; }
    .mobius-mood-select:focus { outline: none; border-color: rgba(227, 188, 103, 0.6); }
    .mobius-viz-wrap { width: 90%; max-width: 900px; height: 70vh; min-height: 320px; display: flex; align-items: center; justify-content: center; flex: 1; }
    .mobius-viz-wrap svg { max-width: 100%; max-height: 100%; object-fit: contain; }
    .mobius-node.mobius-start-node circle { stroke: var(--tool-gold); stroke-width: 3; }
    .mobius-node.mobius-pivot-node circle { stroke: rgba(227, 188, 103, 0.7); stroke-width: 2; }
    .mobius-node.mobius-preferred-node circle { stroke: var(--tool-gold); filter: drop-shadow(0 0 6px rgba(227, 188, 103, 0.5)); }
    .mobius-link-redeemed { stroke-opacity: 0.8; animation: mobius-redeemed-pulse 3s ease-in-out infinite; }
    @keyframes mobius-redeemed-pulse { 0%, 100% { stroke-opacity: 0.7; } 50% { stroke-opacity: 1; } }
    .mobius-card-container { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); width: min(92%, 400px); max-height: 260px; overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 10; }
    .mobius-card-container.visible { opacity: 1; pointer-events: auto; }
    .mobius-node-card { padding: 1rem; background: var(--tool-bg-soft); border: 1px solid var(--tool-line); border-radius: 12px; font-size: 0.9rem; color: #e0e0e0; }
    .mobius-card-title { margin: 0 0 0.5rem; font-size: 1rem; color: var(--tool-gold-soft); }
    .mobius-card-verse, .mobius-card-guidance { margin: 0.5rem 0; color: var(--tool-muted); }
    .mobius-card-verse { font-style: italic; }
    .mobius-card-prayer { margin: 0.6rem 0 0; color: var(--tool-gold-soft); }
    .mobius-fallback { padding: 2rem; text-align: center; color: var(--tool-muted); }
  </style>
