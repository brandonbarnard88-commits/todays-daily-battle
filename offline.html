<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NFQ5GWJXCB"></script>
  <script src="ga-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Today's Daily Battle</title>
  <meta name="description" content="You're offline. Your verses and prayers are still here. Today's Daily Battle works offline—we'll sync when you're back.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://todaysdailybattle.com/offline.html">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #020617;
      color: #f59e0b;
      text-align: center;
      padding: 2rem 1rem;
    }
    .wrap {
      max-width: 34rem;
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.9);
      padding: 1.25rem 1.1rem;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.45), 0 0 16px rgba(245, 158, 11, 0.16);
    }
    h1 {
      margin: 0 0 0.55rem;
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      color: #fbbf24;
    }
    p {
      margin: 0.3rem 0;
      color: #d1d5db;
      line-height: 1.45;
    }
    .offline-retry-btn {
      margin-top: 1rem;
      padding: 0.5rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #020617;
      background: #f59e0b;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .offline-retry-btn:hover { background: #fbbf24; }
  </style>
</head>
<body>
  <main class="wrap" role="main" aria-label="Offline status">
    <h1>You're offline</h1>
    <p>Check your connection and try again.</p>
    <p>Your last cached verse is still available when possible.</p>
    <button type="button" onclick="location.reload()" class="offline-retry-btn" aria-label="Retry connection">Retry</button>
  </main>
</body>
</html>
