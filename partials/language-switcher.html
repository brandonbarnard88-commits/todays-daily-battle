<!--
  Language switcher — reusable fragment for Today's Daily Battle
  - Text only: English · Español · More languages (no flags).
  - Footer: included in partials/site-footer.html (class tdb-lang-switcher--footer).
  - Header: inserted after the top-bar header element via: npm run sync:lang-header
  - Behavior: /language-switcher.js (defer) — sets hrefs for paired EN↔ES pages, localStorage tdb_lang_pref on pick.
  - "More languages" → explore.html#languages (Spanish topical pages still route "More" to #topics-es via language-switcher.js).

  When editing link labels or structure, update the nav below and re-run:
    npm run sync:footer && npm run sync:lang-header
-->
<nav class="tdb-lang-switcher tdb-lang-switcher--footer" aria-label="Choose language" data-tdb-lang-switcher lang="en">
  <span class="tdb-lang-switcher-inner">
    <a class="tdb-lang-opt" href="/" hreflang="en" data-tdb-pick="en">English</a>
    <span class="tdb-lang-sep" aria-hidden="true">·</span>
    <a class="tdb-lang-opt" href="/explore.html#topics-es" hreflang="es" data-tdb-pick="es">Español</a>
    <span class="tdb-lang-sep" aria-hidden="true">·</span>
    <a class="tdb-lang-opt" href="/id/kecemasan.html" hreflang="id" data-tdb-pick="id">Bahasa Indonesia</a>
    <span class="tdb-lang-sep" aria-hidden="true">·</span>
    <a class="tdb-lang-opt tdb-lang-more" href="/explore.html#languages">More languages</a>
  </span>
</nav>
